function shuffle(arr){
  arr = arr.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function q(topic, text, correct, wrongs, explain){
  return {topic,text,correct,options:shuffle([correct,...wrongs].slice(0,4)),explain};
}

function sessionNumber(title){
  const m = title.match(/(\d+)/);
  return m ? Number(m[1]) : 1;
}

const subject = subjectFromTitle(sessionTitle);
const bank = buildBank(subject);
const start = ((sessionNumber(sessionTitle)-1) * 25) % bank.length;
const questions = [];
for(let i=0;i<25;i++){
  questions.push(bank[(start+i) % bank.length]);
}

document.getElementById("titleBox").textContent = sessionTitle;
document.getElementById("subBox").textContent = subject + " | 25 vrae";

function render(){
  selected = null;
  marked = false;

  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
  const item = questions[current];

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markAnswer(){
  if(marked) return;

  const item = questions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers ’n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    score++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg!</span>";
  } else {
    wrongList.push({
      q:item.text,
      your:selected,
      correct:item.correct
    });
    document.getElementById("feedback").innerHTML = "<span class='bad'>☹ Verkeerd. Regte antwoord: " + item.correct + "</span>";
  }

  document.getElementById("explain").textContent = "Verduideliking: " + item.explain;
  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
}

function nextQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(current < questions.length - 1){
    current++;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById("quizBox").style.display = "none";
  const wrong = questions.length - score;

  if(di !== null && ti !== null && wrong === 0){
    localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
  }

  let html = `<h2>Sessie klaar</h2>
    <p><b>${sessionTitle}</b></p>
    <p style="font-size:22px;font-weight:900">Punt: ${score} uit ${questions.length}</p>
    <p>Verkeerd: ${wrong}</p>`;

  if(wrongList.length > 0){
    html += "<h3>Verkeerde antwoorde</h3>";
    wrongList.slice(0,10).forEach(w=>{
      html += `<div class="result"><b>Vraag:</b> ${w.q}<br><b>Sy antwoord:</b> ${w.your}<br><b>Reg:</b> ${w.correct}</div>`;
    });

    html += `<div class="result"><span class="bad">Hy moet eers sy verkeerde vrae reg oefen voordat hy klaar is.</span></div>`;
    html += `<button class="orange" onclick="startWrongRetry()">Oefen verkeerde vrae weer</button>`;
  } else {
    html += `<div class="result"><span class="ok">🎉 Alles eerste keer reg!</span></div>`;
    html += `<button class="green" onclick="sendWhatsapp()">WhatsApp Dad</button>
             <a class="btn gray" href="enrico_exam_program.html?v=${Date.now()}">Terug na program</a>`;
  }

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

function startWrongRetry(){
  if(wrongList.length === 0) return;

  retryMode = true;
  retryOriginalCount = wrongList.length;
  retryCorrectCount = 0;

  retryQuestions = wrongList.map(w => ({
    topic: "Wrong Retry",
    text: w.q,
    correct: w.correct,
    options: shuffle([w.correct, w.your, "Not sure", "Review again"]),
    explain: "This was answered incorrectly earlier. Read it carefully and choose the correct answer."
  }));

  current = 0;
  score = 0;
  selected = null;
  marked = false;
  wrongList = [];

  document.getElementById("finalResult").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  renderRetry();
}

function renderRetry(){
  selected = null;
  marked = false;

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  const item = retryQuestions[current];

  document.getElementById("progress").textContent =
    "Wrong Retry: " + (current + 1) + " van " + retryQuestions.length + " | Reggemaak: " + retryCorrectCount + " van " + retryOriginalCount;

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markRetryAnswer(){
  if(marked) return;

  const item = retryQuestions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers ’n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    retryCorrectCount++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg! Hierdie fout val nou weg.</span>";
    retryQuestions.splice(current, 1);

    if(current >= retryQuestions.length){
      current = 0;
    }
  } else {
    document.getElementById("feedback").innerHTML =
      "<span class='bad'>☹ Nog verkeerd. Regte antwoord: " + item.correct + ". Jy gaan hierdie vraag weer kry.</span>";
  }

  document.getElementById("explain").textContent = item.explain;
}

function nextRetryQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  if(current < retryQuestions.length - 1){
    current++;
  } else {
    current = 0;
  }

  renderRetry();
}

function finishWrongRetry(){
  document.getElementById("quizBox").style.display = "none";

  if(di !== null && ti !== null && wrong === 0){ localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1"); }

  const html = `<h2>Wrong Retry klaar 🎉</h2>
    <p style="font-size:22px;font-weight:900">Al ${retryOriginalCount} verkeerde vrae is nou reggemaak.</p>
    <p>Mooi Enrico — nou is die sessie reg klaar.</p>
    <button class="green" onclick="sendWhatsapp()">WhatsApp Dad</button>
    <a class="btn gray" href="enrico_exam_program.html?v=${Date.now()}">Terug na program</a>`;

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

const originalMarkAnswer = markAnswer;
markAnswer = function(){
  if(retryMode){
    markRetryAnswer();
  } else {
    originalMarkAnswer();
  }
};

const originalNextQuestion = nextQuestion;
nextQuestion = function(){
  if(retryMode){
    nextRetryQuestion();
  } else {
    originalNextQuestion();
  }
};
function sendWhatsapp(){
  const wrong = questions.length - score;
  let msg = `Enrico toets update:
Vak: ${subject}
Sessie: ${sessionTitle}
Punt: ${score}/${questions.length}
Verkeerd: ${wrong}`;

  if(retryOriginalCount > 0 && retryQuestions.length === 0){
    msg += `\nWrong Retry: Klaar - ${retryOriginalCount}/${retryOriginalCount} foute reggemaak`;
  } else if(retryOriginalCount > 0){
    msg += `\nWrong Retry: Nog besig - ${retryCorrectCount}/${retryOriginalCount} foute reggemaak`;
  }

  if(wrongList.length > 0){
    msg += "\\nEerste foute:";
    wrongList.slice(0,5).forEach((w,i)=>{
      msg += `\\n${i+1}) ${w.q} | Reg: ${w.correct}`;
    });
  }

  window.open("https://wa.me/" + DAD + "?text=" + encodeURIComponent(msg), "_blank");
}

render();
</script>
