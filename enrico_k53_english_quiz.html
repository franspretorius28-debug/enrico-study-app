<div class="wrap">

<script>
const Teacher = "27642203726";
const params = new URLSearchParams(location.search);
const sessionTitle = params.get("title") || "K53 Session";
const di = params.get("di");
const ti = params.get("ti");
const subject = "K53 - English";

let current = 0;
let score = 0;
let selected = null;
let marked = false;
let wrongList = [];
let retryMode = false;
let retryQuestions = [];
let retryOriginalCount = 0;
let retryCorrectCount = 0;

function shuffle(arr){
  arr = arr.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function q(topic, text, correct, wrongs, explain){
  return {topic,text,correct,options:shuffle([correct,...wrongs].slice(0,4)),explain};
}

function buildK53Bank(){
  const b = [];

  const fixed = [
    ["Road signs","What does a STOP sign mean?","You must come to a complete stop",["You may drive through slowly","Only trucks must stop","You may speed up"],"At a STOP sign, the vehicle must stop completely."],
    ["Road signs","What does a YIELD sign mean?","Slow down and give way if necessary",["Always stop for ten seconds","Speed up before traffic arrives","Ignore vehicles from the right"],"Yield means you must give way when another road user has priority."],
    ["Road signs","What does a NO ENTRY sign mean?","You may not enter that road",["Parking is allowed","Only taxis may enter","The road is one-way towards you"],"No entry means vehicles are not allowed to enter."],
    ["Traffic lights","What must you do at a red traffic light?","Stop",["Drive through carefully","Speed up","Only hoot and continue"],"Red means stop."],
    ["Traffic lights","What does an amber traffic light mean?","Prepare to stop if it is safe",["Speed up immediately","Stop in the middle of the intersection","Ignore it"],"Amber warns that the light is changing to red."],
    ["Traffic lights","What does a green traffic light mean?","Proceed if it is safe",["Drive without looking","Stop immediately","Reverse slowly"],"Green means you may go, but only when safe."],
    ["Defensive driving","What is defensive driving?","Driving carefully while anticipating danger",["Driving as fast as possible","Driving close behind another vehicle","Ignoring other road users"],"Defensive driving helps prevent accidents."],
    ["Observation","What must you check before changing lanes?","Mirrors, blind spot and indicators",["Only the fuel gauge","Only the radio","Only the speedometer"],"Safe lane changes need mirrors, blind spot and signal."],
    ["Observation","What is a blind spot?","An area you cannot see in your mirrors",["A broken headlight","A road sign","A flat tyre"],"You must check blind spots by looking over your shoulder."],
    ["Safety","When must you wear a seat belt?","Always when driving or riding in a vehicle",["Only on highways","Only at night","Only when police are nearby"],"Seat belts must be worn for safety."],
    ["Following distance","Why is following distance important?","It gives you time to stop safely",["It saves fuel only","It makes you drive faster","It removes the need to brake"],"A safe gap helps avoid rear-end crashes."],
    ["Pedestrians","What must you do at a pedestrian crossing?","Give way and stop if necessary",["Drive around the pedestrian","Hoot and continue","Ignore the pedestrian"],"Pedestrians at crossings must be protected."],
    ["Emergency vehicles","What should you do for an emergency vehicle with a siren?","Move out of the way safely",["Race in front of it","Stop suddenly in the lane","Block it"],"Emergency vehicles must be given space safely."],
    ["School zones","What should you do near a school zone?","Slow down and watch for children",["Speed up","Hoot continuously","Ignore pedestrians"],"School zones need extra care."],
    ["Railway crossings","What must you do if a train is approaching?","Stop and wait until it is safe",["Drive across quickly","Stop on the tracks","Reverse into traffic"],"Never cross when a train is approaching."],
    ["Overtaking","When may you overtake?","Only when it is legal, clear and safe",["On any blind rise","Without checking mirrors","When other cars must brake"],"Overtaking must be legal and safe."],
    ["Road markings","What does a solid white line usually mean?","Do not cross unless allowed and safe",["Always overtake there","Parking only","Pedestrians only"],"Solid lines usually restrict crossing."],
    ["Vehicle controls","What should you do before moving off?","Check mirrors, blind spots and signal",["Just accelerate","Open the door","Switch off the engine"],"Observation comes before moving off."],
    ["Weather","What should you do in heavy rain?","Slow down and increase following distance",["Speed up to leave the rain","Use bright lights only","Drive close behind another car"],"Wet roads need slower speed and more space."],
    ["Skid control","What should you do if the vehicle starts skidding?","Steer gently and avoid harsh braking",["Brake hard immediately","Close your eyes","Accelerate sharply"],"Smooth control helps recover from a skid."],
    ["Roadworthiness","What does roadworthy mean?","The vehicle is safe and legally fit to drive",["The car is expensive","The car is new","The car has loud music"],"A roadworthy vehicle is safe for public roads."],
    ["Tyres","Why must tyre tread be in good condition?","For grip and safe braking",["For louder sound","For better radio signal","For decoration"],"Tyres need grip to stop and steer safely."],
    ["Headlights","When should headlights be used?","At night or when visibility is poor",["Only when parked","Only at noon","Never in rain"],"Lights help you see and be seen."],
    ["Parking","Where should you not park?","Where parking is prohibited or unsafe",["In a marked legal parking bay","At home","In a safe parking area"],"Do not park where signs or danger prohibit it."],
    ["Alcohol","What is the safest rule about alcohol and driving?","Do not drink and drive",["Drink only a little and drive faster","Drive if the road is quiet","Drink coffee and drive"],"Alcohol affects judgement and reaction time."]
  ];

  fixed.forEach(x=>b.push(q(x[0],x[1],x[2],x[3],x[4])));

  const signs = [
    ["STOP sign","come to a complete stop","slow down only","park here","turn around immediately"],
    ["YIELD sign","give way if necessary","speed up","ignore crossing traffic","stop only at night"],
    ["NO ENTRY sign","do not enter this road","enter slowly","park on the left","only trucks enter"],
    ["ONE WAY sign","traffic moves in one direction only","you may drive both ways","the road is closed","pedestrians only"],
    ["NO OVERTAKING sign","do not overtake","overtake immediately","drive on the shoulder","reverse only"],
    ["SPEED LIMIT sign","do not exceed the posted speed","drive at any speed","minimum speed only","parking zone"],
    ["PEDESTRIAN CROSSING sign","watch for pedestrians and be ready to stop","speed up","ignore pedestrians","park on the crossing"],
    ["ROADWORKS sign","slow down and watch for workers or obstacles","drive faster","overtake all vehicles","use your phone"],
    ["SLIPPERY ROAD sign","slow down because the road may be slippery","brake hard","speed up","ignore wet road conditions"],
    ["ROUNDABOUT sign","give way and follow roundabout rules","stop forever","drive straight across the island","overtake inside"]
  ];

  signs.forEach(s=>{
    b.push(q("Road signs","What does a " + s[0] + " require you to do?",s[1],[s[2],s[3],s[4]],"Read the sign and obey the instruction or warning."));
    b.push(q("Road signs","If you see a " + s[0] + ", what is the safest response?",s[1],[s[2],s[3],s[4]],"Road signs are there to control or warn traffic."));
    b.push(q("Road signs","Which answer best matches a " + s[0] + "?",s[1],[s[2],s[3],s[4]],"The correct meaning must match the sign."));
  });

  const situations = [
    ["You want to turn left at an intersection","signal in time, slow down and check for pedestrians",["turn without signalling","cut across traffic","look only after turning"]],
    ["You want to change lanes","check mirrors, blind spot and signal",["move first then look","signal after changing","ignore vehicles behind you"]],
    ["A child runs near the road","slow down and be ready to stop",["speed up","hoot and keep speed","ignore the child"]],
    ["A vehicle is following too closely","keep calm and maintain safe control",["brake sharply to scare the driver","speed far above the limit","swerve suddenly"]],
    ["You approach a sharp bend","slow down before the bend",["brake hard inside the bend","speed up through it","overtake on the bend"]],
    ["You approach a hill with poor visibility","do not overtake and keep left",["overtake quickly","drive in the middle","stop on the crest"]],
    ["Your brakes feel weak","stop safely and have the vehicle checked",["continue fast","ignore it","pump the horn"]],
    ["Your tyre bursts","hold the steering firmly and slow down gradually",["brake hard immediately","turn sharply","accelerate"]],
    ["Fog reduces visibility","slow down and use appropriate lights",["switch off lights","speed up","follow very closely"]],
    ["You are tired while driving","stop and rest",["drive faster","drink alcohol","ignore it"]]
  ];

  situations.forEach(s=>{
    b.push(q("Driving situations","What should you do? " + s[0] + ".",s[1],s[2],"Choose the safest legal action."));
    b.push(q("Defensive driving","Best safe action: " + s[0] + ".",s[1],s[2],"Defensive driving means preventing danger early."));
  });

  const roadRules = [
    ["use your indicator","before turning or changing lanes","after turning","only when police are watching","only on gravel roads"],
    ["keep a safe following distance","so you have time to stop","to race other cars","to save hooter use","to make traffic angry"],
    ["obey speed limits","because they reduce crash risk","only when you feel like it","only near cameras","only on wet roads"],
    ["check mirrors often","to know what is happening around you","to fix your hair","only when reversing","only when parked"],
    ["give way to pedestrians at crossings","to protect pedestrians","only when they wave","only at night","only in rural areas"],
    ["stop at red lights","because red means stop","unless you are late","only if the road is busy","only if there is a camera"],
    ["avoid using a cellphone while driving","because it distracts you","unless texting is short","only in town","only on highways"],
    ["do not overload a vehicle","because it affects control and braking","because it looks untidy only","only for new vehicles","only in rain"],
    ["keep left where required","to allow safe traffic flow","to block faster vehicles","only at night","only for trucks"],
    ["wear a seat belt","to reduce injury in a crash","to avoid using mirrors","to make the car faster","only during tests"]
  ];

  roadRules.forEach(r=>{
    b.push(q("Rules of the road","Why must you " + r[0] + "?",r[1],[r[2],r[3],r[4]],"This is a basic safety rule."));
    b.push(q("Rules of the road","When driving, you should " + r[0] + " " + r[1] + ".", "True", ["False","Only sometimes","Only for learners"], "This rule is part of safe driving."));
  });

  const controls = [
    ["steering wheel","controls the direction of the vehicle",["controls the radio","opens the boot","checks oil"]],
    ["brake pedal","slows or stops the vehicle",["makes the car louder","switches on lights","opens windows"]],
    ["accelerator","increases engine power and speed",["stops the vehicle","locks doors","checks tyres"]],
    ["clutch","helps change gears in a manual vehicle",["turns on hazards","fills fuel","cleans windscreen"]],
    ["handbrake","helps keep the vehicle stationary when parked",["makes the engine faster","turns headlights on","changes lanes"]],
    ["indicator switch","shows your intention to turn or change lanes",["starts the engine","checks oil","opens bonnet"]],
    ["hazard lights","warn others of danger or breakdown",["show you are speeding","replace indicators for turning","mean you can park anywhere"]],
    ["rear-view mirror","helps you see traffic behind",["controls speed","turns the car","fills water"]],
    ["windscreen wipers","clear rain from the windscreen",["inflate tyres","change gears","control brakes"]],
    ["headlights","help you see and be seen",["stop the car","change lanes","open doors"]]
  ];

  controls.forEach(c=>{
    b.push(q("Vehicle controls","What is the purpose of the " + c[0] + "?",c[1],c[2],"Know the basic vehicle controls."));
    b.push(q("Vehicle controls","Which vehicle control " + c[1] + "?",c[0],["brake fluid","number plate","seat cover"],"Match the control to its function."));
  });

  while(b.length < 250){
    const base = b[b.length % Math.min(b.length,80)];
    b.push(q(base.topic, base.text + " Choose the safest answer.", base.correct, shuffle(base.options.filter(o=>o!==base.correct)).slice(0,3), base.explain));
  }

  return b.slice(0,250);
}

function sessionNumber(title){
  const m = title.match(/(\d+)/);
  return m ? Number(m[1]) : 1;
}

const bank = buildK53Bank();
const start = ((sessionNumber(sessionTitle)-1) * 25) % bank.length;
const questions = [];
for(let i=0;i<25;i++){
  questions.push(bank[(start+i) % bank.length]);
}

document.getElementById("titleBox").textContent = sessionTitle;

function render(){
  selected = null;
  marked = false;

  document.getElementById("progress").textContent = `Question ${current+1} of ${questions.length} | Correct: ${score}`;
  const item = questions[current];

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markAnswer(){
  if(marked) return;

  const item = questions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Choose an answer first.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    score++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Correct!</span>";
  } else {
    wrongList.push({q:item.text,your:selected,correct:item.correct,explain:item.explain,options:item.options});
    document.getElementById("feedback").innerHTML = "<span class='bad'>☹ Wrong. Correct answer: " + item.correct + "</span>";
  }

  document.getElementById("explain").textContent = "Explanation: " + item.explain;
  document.getElementById("progress").textContent = `Question ${current+1} of ${questions.length} | Correct: ${score}`;
}

function nextQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Mark the answer first.</span>";
    return;
  }

  if(current < questions.length - 1){
    current++;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById("quizBox").style.display = "none";
  const wrong = questions.length - score;

  let html = `<h2>Session complete</h2>
    <p><b>${sessionTitle}</b></p>
    <p style="font-size:22px;font-weight:900">Score: ${score} out of ${questions.length}</p>
    <p>Wrong: ${wrong}</p>`;

  if(wrongList.length > 0){
    html += "<h3>Wrong answers</h3>";
    wrongList.slice(0,10).forEach(w=>{
      html += `<div class="result"><b>Question:</b> ${w.q}<br><b>His answer:</b> ${w.your}<br><b>Correct:</b> ${w.correct}</div>`;
    });

    html += `<div class="result"><span class="bad">He must first fix his wrong answers before this session counts as complete.</span></div>`;
    html += `<button class="orange" onclick="startWrongRetry()">Practise wrong questions again</button>`;
  } else {
    if(di !== null && ti !== null){
      localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
    }

    html += `<div class="result"><span class="ok">🎉 All correct first time!</span></div>`;
    html += `<button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;
  }

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

function startWrongRetry(){
  if(wrongList.length === 0) return;

  retryMode = true;
  retryOriginalCount = wrongList.length;
  retryCorrectCount = 0;

  retryQuestions = wrongList.map(w => ({
    topic: "Wrong Retry",
    text: w.q,
    correct: w.correct,
    options: shuffle((w.options && w.options.length ? w.options : [w.correct, w.your, "Review answer", "Try again"]).slice()),
    explain: w.explain || "This question was answered incorrectly earlier."
  }));

  current = 0;
  score = 0;
  selected = null;
  marked = false;
  wrongList = [];

  document.getElementById("finalResult").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  renderRetry();
}

function renderRetry(){
  selected = null;
  marked = false;

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  const item = retryQuestions[current];

  document.getElementById("progress").textContent =
    "Wrong Retry: " + (current + 1) + " of " + retryQuestions.length + " | Fixed: " + retryCorrectCount + " of " + retryOriginalCount;

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markRetryAnswer(){
  if(marked) return;

  const item = retryQuestions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Choose an answer first.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    retryCorrectCount++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Correct! This mistake now falls away.</span>";
    retryQuestions.splice(current, 1);
    if(current >= retryQuestions.length){ current = 0; }
  } else {
    document.getElementById("feedback").innerHTML =
      "<span class='bad'>☹ Still wrong. Correct answer: " + item.correct + ". You will get this question again.</span>";
  }

  document.getElementById("explain").textContent = item.explain;
}

function nextRetryQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Mark the answer first.</span>";
    return;
  }

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  if(current < retryQuestions.length - 1){ current++; } else { current = 0; }
  renderRetry();
}

function finishWrongRetry(){
  document.getElementById("quizBox").style.display = "none";

  if(di !== null && ti !== null){
    localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
  }

  const html = `<h2>Wrong Retry complete 🎉</h2>
    <p style="font-size:22px;font-weight:900">All ${retryOriginalCount} wrong questions are now fixed.</p>
    <p>Good work Enrico — now this session counts as complete.</p>
    <div class="result"><span class="ok">Teacher must submit progress to Head Office.</span></div>
    <button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

const originalMarkAnswer = markAnswer;
markAnswer = function(){
  if(retryMode){ markRetryAnswer(); } else { originalMarkAnswer(); }
};

const originalNextQuestion = nextQuestion;
nextQuestion = function(){
  if(retryMode){ nextRetryQuestion(); } else { originalNextQuestion(); }
};

function sendWhatsapp(){
  const originalWrong = retryOriginalCount > 0 ? retryOriginalCount : (25 - score);

  let msg = `Enrico K53 progress update:
Session: ${sessionTitle}
Question bank: 250 English K53 questions
Score: ${25 - originalWrong}/25
Original wrong: ${originalWrong}`;

  if(retryOriginalCount > 0 && retryQuestions.length === 0){
    msg += `\nWrong Retry: Complete - ${retryOriginalCount}/${retryOriginalCount} mistakes fixed`;
  } else if(retryOriginalCount === 0){
    msg += `\nWrong Retry: Not needed - all correct first time`;
  }

  window.open("https://wa.me/" + Teacher + "?text=" + encodeURIComponent(msg), "_blank");

  setTimeout(function(){
    window.location.href = "enrico_exam_program.html?v=" + Date.now();
  }, 1200);
}

render();
</script>
</body>
</html>
