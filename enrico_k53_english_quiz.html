function shuffle(arr){
  arr = arr.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function q(topic, text, correct, wrongs, explain){
  return {topic,text,correct,options:shuffle([correct,...wrongs].slice(0,4)),explain};
}

function sessionNumber(title){

/* TEAE_STRICT_UNIQUE_BANK_AND_SESSIONS_V1 */
function teaeStrictNorm(v){
  return String(v || "")
    .toLowerCase()
    .replace(/[’']/g,"")
    .replace(/[^a-z0-9áéíóúêëïöüàèìòùâîôûäëïöü\s\/\-]/gi," ")
    .replace(/\s+/g," ")
    .trim();
}

function teaeStrictOptionKey(item){
  const opts = (item && item.options ? item.options : [])
    .map(teaeStrictNorm)
    .filter(Boolean)
    .sort();
  return opts.join(" | ");
}

function teaeStrictConceptKey(item){
  const text = teaeStrictNorm((item && (item.text || item.q)) || "");
  const correct = teaeStrictNorm((item && item.correct) || "");
  const topic = teaeStrictNorm((item && item.topic) || "");

  let m = text.match(/\b(slippery road|roundabout|stop sign|amber traffic light|red traffic light|green traffic light|yield sign|give way|no entry|speed limit|pedestrian crossing|school zone|road works|traffic light|seat belt|following distance|defensive driving|emergency vehicle|roadworthy|overtake|intersection)\b/i);
  if(m) return "k53:" + m[1].replace(/\s+/g," ");

  m = text.match(/\b(lan|wi[\-\s]?fi|wan|html|cpu|ram|rom|usb|url|www|excel|word|powerpoint|database|spreadsheet|email|internet|browser|operating system|virus|firewall|backup|cloud|folder|file|keyboard|mouse|monitor|printer|network|router|password|software|hardware)\b/i);
  if(m) return "rtt:" + m[1].replace(/\s+/g,"").replace("-","");

  if(correct && correct.length > 3 && !["true","false","waar","onwaar","ja","nee"].includes(correct)){
    return "answer:" + topic + ":" + correct;
  }

  return "text:" + text.split(" ").slice(0,7).join(" ");
}

function teaeStrictUniqueBank(rawList){
  const seenText = new Set();
  const seenOption = new Set();
  const seenCorrectOption = new Set();
  const seenConceptOption = new Set();
  const unique = [];

  (rawList || []).forEach(function(item){
    if(!item) return;

    const text = teaeStrictNorm(item.text || item.q || "");
    const correct = teaeStrictNorm(item.correct || "");
    const optionKey = teaeStrictOptionKey(item);
    const concept = teaeStrictConceptKey(item);

    if(!text || !correct || !optionKey) return;

    const correctOptionKey = correct + " || " + optionKey;
    const conceptOptionKey = concept + " || " + optionKey;

    // Hard stops vir duplicate gevoel
    if(seenText.has(text)) return;
    if(seenOption.has(optionKey)) return;
    if(seenCorrectOption.has(correctOptionKey)) return;
    if(seenConceptOption.has(conceptOptionKey)) return;

    seenText.add(text);
    seenOption.add(optionKey);
    seenCorrectOption.add(correctOptionKey);
    seenConceptOption.add(conceptOptionKey);
    unique.push(item);
  });

  window.TEAE_RAW_BANK_COUNT = (rawList || []).length;
  window.TEAE_UNIQUE_BANK_COUNT = unique.length;

  if(unique.length < 200){
    console.warn("TEAE WARNING: Unique bank is below 200", {
      raw: window.TEAE_RAW_BANK_COUNT,
      unique: window.TEAE_UNIQUE_BANK_COUNT
    });
  }

  return unique;
}

function teaeHashSeed(s){
  s = String(s || "");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
  }
  return h >>> 0;
}

function teaeShuffleForTitle(list){
  const params = new URLSearchParams(window.location.search);
  const title = params.get("title") || "";
  const seed = title + "|" + (params.get("di") || "") + "|" + (params.get("ti") || "");
  return (list || []).slice().sort(function(a,b){
    const ah = teaeHashSeed(seed + "|" + (a.text || a.q || "") + "|" + (a.correct || ""));
    const bh = teaeHashSeed(seed + "|" + (b.text || b.q || "") + "|" + (b.correct || ""));
    return ah - bh;
  });
}

let teaeStrictSessionFixed = false;

function teaeStrictFixSession(){
  if(teaeStrictSessionFixed) return;
  teaeStrictSessionFixed = true;

  if(typeof questions === "undefined" || !Array.isArray(questions)) return;
  if(typeof bank === "undefined" || !Array.isArray(bank)) return;

  const wanted = questions.length || 25;
  const source = teaeShuffleForTitle(bank);

  const usedText = new Set();
  const usedConcept = new Set();
  const usedOption = new Set();
  const clean = [];

  function add(item){
    if(!item || clean.length >= wanted) return;

    const text = teaeStrictNorm(item.text || item.q || "");
    const concept = teaeStrictConceptKey(item);
    const optionKey = teaeStrictOptionKey(item);

    if(!text || !optionKey) return;
    if(usedText.has(text)) return;
    if(usedConcept.has(concept)) return;
    if(usedOption.has(optionKey)) return;

    usedText.add(text);
    usedConcept.add(concept);
    usedOption.add(optionKey);
    clean.push(item);
  }

  source.forEach(add);

  // Safety: as daar nie 25 is nie, vul net met unieke vraagteks, maar geen exact duplicates nie.
  source.forEach(function(item){
    if(clean.length >= wanted) return;
    const text = teaeStrictNorm(item && (item.text || item.q));
    if(text && !usedText.has(text)){
      usedText.add(text);
      clean.push(item);
    }
  });

  questions.length = 0;
  clean.slice(0,wanted).forEach(function(x){ questions.push(x); });
}

function teaeRewriteDuplicateQuestionV2(item, count, index){

function teaeEnsureUniqueOptionsV2(item, seenOptionSets, index){
  if(!item || !Array.isArray(item.options)) return;

  const pool = teaeSubjectPoolV2();
  const correct = String(item.correct || "").trim();

  let options = item.options.map(x => String(x || "").trim()).filter(Boolean);

  if(correct && !options.some(o => teaeCleanNormV2(o) === teaeCleanNormV2(correct))){
    options.unshift(correct);
  }

  // Maak eers binne die vraag uniek.
  const seenInside = new Set();
  options = options.filter(o => {
    const k = teaeCleanNormV2(o);
    if(!k || seenInside.has(k)) return false;
    seenInside.add(k);
    return true;
  });

  let poolPos = index % pool.length;

  while(options.length < 4 && poolPos < pool.length * 3){
    const candidate = pool[poolPos % pool.length];
    poolPos++;

    const ck = teaeCleanNormV2(candidate);
    if(ck && ck !== teaeCleanNormV2(correct) && !seenInside.has(ck)){
      seenInside.add(ck);
      options.push(candidate);
    }
  }

  function keyFor(opts){
    return opts.map(teaeCleanNormV2).filter(Boolean).sort().join(" | ");
  }

  // As hele opsie-stel herhaal, vervang een verkeerde opsie.
  let attempt = 0;
  while(seenOptionSets.has(keyFor(options)) && attempt < pool.length * 2){
    const candidate = pool[(index + attempt) % pool.length];
    attempt++;

    const ck = teaeCleanNormV2(candidate);
    if(!ck || ck === teaeCleanNormV2(correct)) continue;
    if(options.some(o => teaeCleanNormV2(o) === ck)) continue;

    let replaceAt = options.findIndex(o => teaeCleanNormV2(o) !== teaeCleanNormV2(correct));
    if(replaceAt < 0) replaceAt = options.length - 1;

    options[replaceAt] = candidate;
  }

  item.options = options.slice(0,4);
  seenOptionSets.add(keyFor(item.options));
}

function teaeReal250UniqueBankV2(rawList){
  const list = (rawList || []).map(q => {
    const copy = Object.assign({}, q);
    copy.options = Array.isArray(q.options) ? q.options.slice() : [];
    return copy;
  });

  const seenTexts = new Map();
  const seenOptionSets = new Set();

  list.forEach(function(item, index){
    const textKey = teaeCleanNormV2(item.text || item.q || "");

    if(seenTexts.has(textKey)){
      const count = seenTexts.get(textKey) + 1;
      seenTexts.set(textKey, count);
      teaeRewriteDuplicateQuestionV2(item, count, index);
    } else {
      seenTexts.set(textKey, 1);
    }

    // As rewrite nog steeds bots, voeg ’n kort unieke vak-konteks by.
    let newKey = teaeCleanNormV2(item.text || item.q || "");
    if(seenTexts.has("final:" + newKey)){
      item.text = String(item.text || item.q || "") + " [" + (index + 1) + "]";
      newKey = teaeCleanNormV2(item.text || item.q || "");
    }
    seenTexts.set("final:" + newKey, 1);

    teaeEnsureUniqueOptionsV2(item, seenOptionSets, index);
  });

  return list;
}

  document.getElementById("quizBox").style.display = "none";

  if(di !== null && ti !== null){
    localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
  }

  const html = `<h2>Wrong Retry complete 🎉</h2>
    <p style="font-size:22px;font-weight:900">All ${retryOriginalCount} wrong questions are now fixed.</p>
    <p>Good work Enrico — now this session counts as complete.</p>
    <div class="result"><span class="ok">Teacher must submit progress to Head Office.</span></div>
    <button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

const originalMarkAnswer = markAnswer;
markAnswer = function(){
  if(retryMode){ markRetryAnswer(); } else { originalMarkAnswer(); }
};

const originalNextQuestion = nextQuestion;
nextQuestion = function(){
  if(retryMode){ nextRetryQuestion(); } else { originalNextQuestion(); }
};

function sendWhatsapp(){
  const originalWrong = retryOriginalCount > 0 ? retryOriginalCount : (25 - score);

  let msg = `Enrico K53 progress update:
Session: ${sessionTitle}
Question bank: 250 English K53 questions
Score: ${25 - originalWrong}/25
Original wrong: ${originalWrong}`;

  if(retryOriginalCount > 0 && retryQuestions.length === 0){
    msg += `\nWrong Retry: Complete - ${retryOriginalCount}/${retryOriginalCount} mistakes fixed`;
  } else if(retryOriginalCount === 0){
    msg += `\nWrong Retry: Not needed - all correct first time`;
  }

  window.open("https://wa.me/" + Teacher + "?text=" + encodeURIComponent(msg), "_blank");

  setTimeout(function(){
    window.location.href = "enrico_exam_program.html?v=" + Date.now();
  }, 1200);
}

render();
</script>
</body>
</html>
