function shuffle(arr){
  arr = arr.slice();
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function q(topic, text, correct, wrongs, explain){
  return {topic,text,correct,options:shuffle([correct,...wrongs].slice(0,4)),explain};
}

function sessionNumber(title){
  const m = title.match(/(\d+)/);
  return m ? Number(m[1]) : 1;
}

/* TEAE_PROFESSIONAL_UNIQUE_QUESTION_BANK_V1 */
function teaeNormQuestionText(v){
  return String(v || "")
    .toLowerCase()
    .replace(/[^a-z0-9áéíóúêëïöüàèìòùâîôûäëïöü\s]/gi, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function teaeIsTrueFalseOptionSet(optionKey){
  return optionKey.includes("true") ||
         optionKey.includes("false") ||
         optionKey.includes("waar") ||
         optionKey.includes("onwaar");
}

function teaeProfessionalizeBank(list){
  const seenQuestion = new Set();
  const seenOptionSet = new Set();
  const seenCorrectOptionSet = new Set();
  const clean = [];

  (list || []).forEach(function(item){
    if(!item) return;

    const qText = teaeNormQuestionText(item.text || item.q || "");
    const correct = teaeNormQuestionText(item.correct || "");
    const opts = (item.options || []).map(teaeNormQuestionText).filter(Boolean);
    const optionKey = opts.slice().sort().join(" | ");
    const correctOptionKey = correct + " || " + optionKey;
    const isTrueFalse = teaeIsTrueFalseOptionSet(optionKey);

    if(!qText || opts.length < 4) return;

    if(seenQuestion.has(qText)) return;

    // Hierdie stop die copy/paste gevoel:
    // dieselfde 4 opsies moet nie oor en oor in dieselfde bank/session voorkom nie.
    // True/False vrae word toegelaat omdat hulle natuurlik dieselfde opsies kan hê.
    if(!isTrueFalse && seenOptionSet.has(optionKey)) return;
    if(!isTrueFalse && seenCorrectOptionSet.has(correctOptionKey)) return;

    seenQuestion.add(qText);
    seenOptionSet.add(optionKey);
    seenCorrectOptionSet.add(correctOptionKey);
    clean.push(item);
  });

  // Safety fallback: as 'n vak te min oorhou, voeg unieke vrae terug,
  // maar steeds nie dieselfde vraag-teks nie.
  if(clean.length < 80){
    (list || []).forEach(function(item){
      if(!item) return;
      const qText = teaeNormQuestionText(item.text || item.q || "");
      if(!qText || seenQuestion.has(qText)) return;
      seenQuestion.add(qText);
      clean.push(item);
    });
  }

  return clean;
}

  selected = null;
  marked = false;
  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
  const item = questions[current];

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markAnswer(){
  if(marked) return;
  const item = questions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    score++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg!</span>";
  } else {
    wrongList.push({q:item.text,your:selected,correct:item.correct,explain:item.explain,options:item.options});
    document.getElementById("feedback").innerHTML = "<span class='bad'>☹ Verkeerd. Regte antwoord: " + item.correct + "</span>";
  }

  document.getElementById("explain").textContent = "Verduideliking: " + item.explain;
  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
}

function nextQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(current < questions.length - 1){
    current++;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById("quizBox").style.display = "none";
  const wrong = questions.length - score;

  let html = `<h2>Sessie klaar</h2>
    <p><b>${sessionTitle}</b></p>
    <p style="font-size:22px;font-weight:900">Punt: ${score} uit ${questions.length}</p>
    <p>Verkeerd: ${wrong}</p>`;

  if(wrongList.length > 0){
    html += "<h3>Verkeerde antwoorde</h3>";
    wrongList.slice(0,10).forEach(w=>{
      html += `<div class="result"><b>Vraag:</b> ${w.q}<br><b>Sy antwoord:</b> ${w.your}<br><b>Reg:</b> ${w.correct}</div>`;
    });

    html += `<div class="result"><span class="bad">Hy moet eers sy verkeerde vrae reg oefen voordat hierdie sessie klaar tel.</span></div>`;
    html += `<button class="orange" onclick="startWrongRetry()">Oefen verkeerde vrae weer</button>`;
  } else {
    if(di !== null && ti !== null){
      localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
    }

    html += `<div class="result"><span class="ok">🎉 Alles eerste keer reg!</span></div>`;
    html += `<button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;
  }

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

function startWrongRetry(){
  if(wrongList.length === 0) return;

  retryMode = true;
  retryOriginalCount = wrongList.length;
  retryCorrectCount = 0;

  retryQuestions = wrongList.map(w => ({
    topic: "Wrong Retry",
    text: w.q,
    correct: w.correct,
    options: shuffle((w.options && w.options.length ? w.options : [w.correct, w.your, "Review answer", "Try again"]).slice()),
    explain: w.explain || "Hierdie vraag was vroeer verkeerd."
  }));

  current = 0;
  score = 0;
  selected = null;
  marked = false;
  wrongList = [];

  document.getElementById("finalResult").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  renderRetry();
}

function renderRetry(){
  selected = null;
  marked = false;

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  const item = retryQuestions[current];

  document.getElementById("progress").textContent =
    "Wrong Retry: " + (current + 1) + " van " + retryQuestions.length + " | Reggemaak: " + retryCorrectCount + " van " + retryOriginalCount;

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markRetryAnswer(){
  if(marked) return;

  const item = retryQuestions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    retryCorrectCount++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg! Hierdie fout val nou weg.</span>";
    retryQuestions.splice(current, 1);
    if(current >= retryQuestions.length){ current = 0; }
  } else {
    document.getElementById("feedback").innerHTML =
      "<span class='bad'>☹ Nog verkeerd. Regte antwoord: " + item.correct + ". Jy gaan hierdie vraag weer kry.</span>";
  }

  document.getElementById("explain").textContent = item.explain;
}

function nextRetryQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  if(current < retryQuestions.length - 1){ current++; } else { current = 0; }
  renderRetry();
}

function finishWrongRetry(){
  document.getElementById("quizBox").style.display = "none";

  if(di !== null && ti !== null){
    localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
  }

  const html = `<h2>Wrong Retry klaar 🎉</h2>
    <p style="font-size:22px;font-weight:900">Al ${retryOriginalCount} verkeerde vrae is nou reggemaak.</p>
    <p>Mooi Enrico — nou tel hierdie sessie as klaar.</p>
    <div class="result"><span class="ok">Teacher must submit progress to Head Office.</span></div>
    <button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

const originalMarkAnswer = markAnswer;
markAnswer = function(){
  if(retryMode){ markRetryAnswer(); } else { originalMarkAnswer(); }
};

const originalNextQuestion = nextQuestion;
nextQuestion = function(){
  if(retryMode){ nextRetryQuestion(); } else { originalNextQuestion(); }
};

function sendWhatsapp(){
  const originalWrong = retryOriginalCount > 0 ? retryOriginalCount : (25 - score);

  let msg = `Enrico Afrikaans progress update:
Sessie: ${sessionTitle}
Vraagbank: 250 Afrikaans HT vrae
Punt: ${25 - originalWrong}/25
Oorspronklik verkeerd: ${originalWrong}`;

  if(retryOriginalCount > 0 && retryQuestions.length === 0){
    msg += `\nWrong Retry: Klaar - ${retryOriginalCount}/${retryOriginalCount} foute reggemaak`;
  } else if(retryOriginalCount === 0){
    msg += `\nWrong Retry: Nie nodig nie - alles eerste keer reg`;
  }

  window.open("https://wa.me/" + Teacher + "?text=" + encodeURIComponent(msg), "_blank");

  setTimeout(function(){
    window.location.href = "enrico_exam_program.html?v=" + Date.now();
  }, 1200);
}

render();
</script>
</body>
</html>
