<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enrico Rooster Audit</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#050505;
      color:#fff;
      padding:24px;
    }
    h1{font-size:32px;margin-bottom:8px}
    .note{color:#cbd5e1;margin-bottom:20px}
    .final{
      border:2px solid #22c55e;
      background:#052e16;
      border-radius:16px;
      padding:20px;
      margin-bottom:18px;
      font-size:24px;
      font-weight:900;
    }
    .badFinal{
      border-color:#ef4444;
      background:#450a0a;
    }
    .card{
      border:1px solid #334155;
      background:#111827;
      border-radius:14px;
      padding:16px;
      margin:14px 0;
    }
    .pass{color:#22c55e;font-weight:900}
    .fail{color:#ef4444;font-weight:900}
    .warn{color:#facc15;font-weight:900}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{border-bottom:1px solid #334155;padding:9px;text-align:left;vertical-align:top}
    iframe{
      width:100%;
      height:420px;
      border:2px solid #334155;
      border-radius:16px;
      margin-top:18px;
      background:#000;
    }
    code{color:#93c5fd}
  </style>
</head>
<body>
  <h1>Enrico Rooster Audit</h1>
  <div class="note">
    Hierdie bladsy kyk of die rooster reg is: eksamens 09:00, Vrydae net tot 12:00, en geen Saterdag/Sondag werk nie.
  </div>

  <div id="final" class="final">Besig om rooster te toets...</div>
  <div id="results"></div>

  <iframe id="programFrame" src="enrico_exam_program.html?audit=1&v=ROOSTER_AUDIT"></iframe>

<script>
(function(){
  const expectedExams = [
    {date:"09 Junie", subject:"K53"},
    {date:"12 Junie", subject:"RTT"},
    {date:"19 Junie", subject:"Landbou"},
    {date:"23 Junie", subject:"Wiskundige Geletterdheid"},
    {date:"24 Junie", subject:"Afrikaans"},
    {date:"25 Junie", subject:"English"},
    {date:"26 Junie", subject:"Besigheidstudies"}
  ];

  const checks = [];

  function addCheck(name, ok, detail){
    checks.push({name, ok, detail: detail || ""});
  }

  function clean(s){
    return String(s || "").replace(/\s+/g," ").trim();
  }

  function findDayBlocks(doc){
    const all = Array.from(doc.querySelectorAll("div, section, article"));
    return all.filter(el => {
      const t = clean(el.innerText);
      if(t.length < 80 || t.length > 6000) return false;
      return /(Maandag|Dinsdag|Woensdag|Donderdag|Vrydag|Saterdag|Sondag)\s+\d{2}\s+Junie/i.test(t);
    }).sort((a,b) => clean(a.innerText).length - clean(b.innerText).length);
  }

  function getTimes(text){
    const out = [];
    const re = /\b(\d{2}):(\d{2})\s*-\s*(\d{2}):(\d{2})\b/g;
    let m;
    while((m = re.exec(text))){
      out.push({
        raw:m[0],
        startH:Number(m[1]),
        startM:Number(m[2]),
        endH:Number(m[3]),
        endM:Number(m[4])
      });
    }
    return out;
  }

  function isAfter12(time){
    return time.startH > 12 || (time.startH === 12 && time.startM > 0) || time.endH > 12 || (time.endH === 12 && time.endM > 0);
  }

  function runAudit(){
    const frame = document.getElementById("programFrame");
    const doc = frame.contentDocument || frame.contentWindow.document;
    const bodyText = clean(doc.body.innerText || "");

    // Expected exams
    expectedExams.forEach(exam => {
      const hasDate = bodyText.toLowerCase().includes(exam.date.toLowerCase());
      const hasSubject = bodyText.toLowerCase().includes(exam.subject.toLowerCase());
      addCheck(
        "Eksamen datum: " + exam.date + " - " + exam.subject,
        hasDate && hasSubject,
        hasDate && hasSubject ? "Gevind op rooster." : "Kon nie die datum/vak duidelik vind nie."
      );
    });

    // Exam day 09:00 + motivation
    expectedExams.forEach(exam => {
      const dayBlocks = findDayBlocks(doc).filter(el => clean(el.innerText).toLowerCase().includes(exam.date.toLowerCase()));
      const block = dayBlocks[0];
      if(!block){
        addCheck("Eksamenblok gevind: " + exam.date, false, "Geen dagblok gevind vir " + exam.date);
        return;
      }

      const txt = clean(block.innerText);
      const hasNine = /09:00|09h00/i.test(txt);
      const hasReady = /jy is nou reg/i.test(txt);
      const hasMainExam = /hoof eksamen app/i.test(txt);
      const hasTerm2 = /kwartaal 2/i.test(txt);
      const hasSterkte = /sterkte|jy kan dit doen/i.test(txt);

      addCheck("Eksamen begin 09:00: " + exam.date, hasNine, hasNine ? "09:00/09h00 wys." : "09:00 wys nie duidelik nie.");
      addCheck("Motiveringsboodskap: " + exam.date, hasReady && hasMainExam && hasTerm2 && hasSterkte,
        hasReady && hasMainExam && hasTerm2 && hasSterkte ? "Boodskap is volledig." : "Boodskap kort iets: jy is nou reg / hoof eksamen app / kwartaal 2 / sterkte."
      );
    });

    // Fridays only until 12:00
    const fridayBlocks = findDayBlocks(doc).filter(el => /Vrydag/i.test(clean(el.innerText)));
    if(fridayBlocks.length === 0){
      addCheck("Vrydae bestaan op rooster", true, "Geen Vrydag blokke gevind om te toets nie.");
    } else {
      fridayBlocks.forEach((block, idx) => {
        const txt = clean(block.innerText);
        const badTimes = getTimes(txt).filter(isAfter12);
        addCheck(
          "Vrydag net tot 12:00 - blok " + (idx+1),
          badTimes.length === 0,
          badTimes.length === 0 ? "Geen tyd ná 12:00 gevind nie." : "Tye ná 12:00 gevind: " + badTimes.map(x => x.raw).join(", ")
        );
      });
    }

    // No Saturday/Sunday work blocks
    const weekendWords = ["Saterdag", "Sondag"];
    weekendWords.forEach(day => {
      const weekendBlocks = findDayBlocks(doc).filter(el => clean(el.innerText).toLowerCase().includes(day.toLowerCase()));
      const withTasks = weekendBlocks.filter(el => {
        const t = clean(el.innerText);
        return /Maak toets oop|Klaar|Nog nie klaar nie|\d{2}:\d{2}\s*-/i.test(t);
      });

      addCheck(
        day + " geen leerblokke",
        withTasks.length === 0,
        withTasks.length === 0 ? "Geen werk/toetse op " + day + " gevind nie." : "Daar is moontlik werk/toetse op " + day + "."
      );
    });

    const passed = checks.filter(c => c.ok).length;
    const failed = checks.filter(c => !c.ok).length;

    const final = document.getElementById("final");
    if(failed === 0){
      final.className = "final";
      final.innerHTML = "Final Result: ROOSTER IS REG ✅";
    } else {
      final.className = "final badFinal";
      final.innerHTML = "Final Result: ROOSTER HET NOG " + failed + " PROBLEEM(E) ❌";
    }

    const rows = checks.map(c => `
      <tr>
        <td>${c.name}</td>
        <td class="${c.ok ? "pass" : "fail"}">${c.ok ? "PASS" : "FAIL"}</td>
        <td>${c.detail}</td>
      </tr>
    `).join("");

    document.getElementById("results").innerHTML = `
      <div class="card">
        <h2>Opsomming</h2>
        <p><span class="pass">PASS:</span> ${passed} &nbsp; | &nbsp; <span class="fail">FAIL:</span> ${failed}</p>
        <table>
          <thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  document.getElementById("programFrame").addEventListener("load", function(){
    setTimeout(runAudit, 1500);
    setTimeout(runAudit, 3000);
  });
})();
</script>
</body>
</html>
