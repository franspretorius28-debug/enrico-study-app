/* TEAE_STRICT_UNIQUE_BANK_AND_SESSIONS_V1 */
function teaeStrictNorm(v){
  return String(v || "")
    .toLowerCase()
    .replace(/[’']/g,"")
    .replace(/[^a-z0-9áéíóúêëïöüàèìòùâîôûäëïöü\s\/\-]/gi," ")
    .replace(/\s+/g," ")
    .trim();
}

function teaeStrictOptionKey(item){
  const opts = (item && item.options ? item.options : [])
    .map(teaeStrictNorm)
    .filter(Boolean)
    .sort();
  return opts.join(" | ");
}

function teaeStrictConceptKey(item){
  const text = teaeStrictNorm((item && (item.text || item.q)) || "");
  const correct = teaeStrictNorm((item && item.correct) || "");
  const topic = teaeStrictNorm((item && item.topic) || "");

  let m = text.match(/\b(slippery road|roundabout|stop sign|amber traffic light|red traffic light|green traffic light|yield sign|give way|no entry|speed limit|pedestrian crossing|school zone|road works|traffic light|seat belt|following distance|defensive driving|emergency vehicle|roadworthy|overtake|intersection)\b/i);
  if(m) return "k53:" + m[1].replace(/\s+/g," ");

  m = text.match(/\b(lan|wi[\-\s]?fi|wan|html|cpu|ram|rom|usb|url|www|excel|word|powerpoint|database|spreadsheet|email|internet|browser|operating system|virus|firewall|backup|cloud|folder|file|keyboard|mouse|monitor|printer|network|router|password|software|hardware)\b/i);
  if(m) return "rtt:" + m[1].replace(/\s+/g,"").replace("-","");

  if(correct && correct.length > 3 && !["true","false","waar","onwaar","ja","nee"].includes(correct)){
    return "answer:" + topic + ":" + correct;
  }

  return "text:" + text.split(" ").slice(0,7).join(" ");
}

function teaeStrictUniqueBank(rawList){
  const seenText = new Set();
  const seenOption = new Set();
  const seenCorrectOption = new Set();
  const seenConceptOption = new Set();
  const unique = [];

  (rawList || []).forEach(function(item){
    if(!item) return;

    const text = teaeStrictNorm(item.text || item.q || "");
    const correct = teaeStrictNorm(item.correct || "");
    const optionKey = teaeStrictOptionKey(item);
    const concept = teaeStrictConceptKey(item);

    if(!text || !correct || !optionKey) return;

    const correctOptionKey = correct + " || " + optionKey;
    const conceptOptionKey = concept + " || " + optionKey;

    // Hard stops vir duplicate gevoel
    if(seenText.has(text)) return;
    if(seenOption.has(optionKey)) return;
    if(seenCorrectOption.has(correctOptionKey)) return;
    if(seenConceptOption.has(conceptOptionKey)) return;

    seenText.add(text);
    seenOption.add(optionKey);
    seenCorrectOption.add(correctOptionKey);
    seenConceptOption.add(conceptOptionKey);
    unique.push(item);
  });

  window.TEAE_RAW_BANK_COUNT = (rawList || []).length;
  window.TEAE_UNIQUE_BANK_COUNT = unique.length;

  if(unique.length < 200){
    console.warn("TEAE WARNING: Unique bank is below 200", {
      raw: window.TEAE_RAW_BANK_COUNT,
      unique: window.TEAE_UNIQUE_BANK_COUNT
    });
  }

  return unique;
}

function teaeHashSeed(s){
  s = String(s || "");
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
  }
  return h >>> 0;
}

function teaeShuffleForTitle(list){
  const params = new URLSearchParams(window.location.search);
  const title = params.get("title") || "";
  const seed = title + "|" + (params.get("di") || "") + "|" + (params.get("ti") || "");
  return (list || []).slice().sort(function(a,b){
    const ah = teaeHashSeed(seed + "|" + (a.text || a.q || "") + "|" + (a.correct || ""));
    const bh = teaeHashSeed(seed + "|" + (b.text || b.q || "") + "|" + (b.correct || ""));
    return ah - bh;
  });
}

  const source = teaeShuffleForTitle(bank);

  const usedText = new Set();
  const usedConcept = new Set();
  const usedOption = new Set();
  const clean = [];

  function add(item){
    if(!item || clean.length >= wanted) return;

    const text = teaeStrictNorm(item.text || item.q || "");
    const concept = teaeStrictConceptKey(item);
    const optionKey = teaeStrictOptionKey(item);

    if(!text || !optionKey) return;
    if(usedText.has(text)) return;
    if(usedConcept.has(concept)) return;
    if(usedOption.has(optionKey)) return;

    usedText.add(text);
    usedConcept.add(concept);
    usedOption.add(optionKey);
    clean.push(item);
  }

  source.forEach(add);

  // Safety: as daar nie 25 is nie, vul net met unieke vraagteks, maar geen exact duplicates nie.
  source.forEach(function(item){
    if(clean.length >= wanted) return;
    const text = teaeStrictNorm(item && (item.text || item.q));
    if(text && !usedText.has(text)){
      usedText.add(text);
      clean.push(item);
    }
  });

  questions.length = 0;
  clean.slice(0,wanted).forEach(function(x){ questions.push(x); });
}

function teaeEnsureUniqueOptionsV2(item, seenOptionSets, index){
  if(!item || !Array.isArray(item.options)) return;

  const pool = teaeSubjectPoolV2();
  const correct = String(item.correct || "").trim();

  let options = item.options.map(x => String(x || "").trim()).filter(Boolean);

  if(correct && !options.some(o => teaeCleanNormV2(o) === teaeCleanNormV2(correct))){
    options.unshift(correct);
  }

  // Maak eers binne die vraag uniek.
  const seenInside = new Set();
  options = options.filter(o => {
    const k = teaeCleanNormV2(o);
    if(!k || seenInside.has(k)) return false;
    seenInside.add(k);
    return true;
  });

  let poolPos = index % pool.length;

  while(options.length < 4 && poolPos < pool.length * 3){
    const candidate = pool[poolPos % pool.length];
    poolPos++;

    const ck = teaeCleanNormV2(candidate);
    if(ck && ck !== teaeCleanNormV2(correct) && !seenInside.has(ck)){
      seenInside.add(ck);
      options.push(candidate);
    }
  }

  function keyFor(opts){
    return opts.map(teaeCleanNormV2).filter(Boolean).sort().join(" | ");
  }

  // As hele opsie-stel herhaal, vervang een verkeerde opsie.
  let attempt = 0;
  while(seenOptionSets.has(keyFor(options)) && attempt < pool.length * 2){
    const candidate = pool[(index + attempt) % pool.length];
    attempt++;

    const ck = teaeCleanNormV2(candidate);
    if(!ck || ck === teaeCleanNormV2(correct)) continue;
    if(options.some(o => teaeCleanNormV2(o) === ck)) continue;

    let replaceAt = options.findIndex(o => teaeCleanNormV2(o) !== teaeCleanNormV2(correct));
    if(replaceAt < 0) replaceAt = options.length - 1;

    options[replaceAt] = candidate;
  }

  item.options = options.slice(0,4);
  seenOptionSets.add(keyFor(item.options));
}

function teaeReal250UniqueBankV2(rawList){
  const list = (rawList || []).map(q => {
    const copy = Object.assign({}, q);
    copy.options = Array.isArray(q.options) ? q.options.slice() : [];
    return copy;
  });

  const seenTexts = new Map();
  const seenOptionSets = new Set();

  list.forEach(function(item, index){
    const textKey = teaeCleanNormV2(item.text || item.q || "");

    if(seenTexts.has(textKey)){
      const count = seenTexts.get(textKey) + 1;
      seenTexts.set(textKey, count);
      teaeRewriteDuplicateQuestionV2(item, count, index);
    } else {
      seenTexts.set(textKey, 1);
    }

    // As rewrite nog steeds bots, voeg ’n kort unieke vak-konteks by.
    let newKey = teaeCleanNormV2(item.text || item.q || "");
    if(seenTexts.has("final:" + newKey)){
      item.text = String(item.text || item.q || "") + " [" + (index + 1) + "]";
      newKey = teaeCleanNormV2(item.text || item.q || "");
    }
    seenTexts.set("final:" + newKey, 1);

    teaeEnsureUniqueOptionsV2(item, seenOptionSets, index);
  });

  return list;
}

    ["Lêertipes","n lêer met .xlsx eindig","XLSX is gewoonlik n Excel sigblad",["XLSX is n foto kamera","XLSX is n skermknoppie","XLSX is n printer kabel","XLSX is n router fout","XLSX is n klanklêer","XLSX is n muismat"]],
    ["Aanlyn veiligheid","n webwerf persoonlike besonderhede vra","Maak seker die webwerf is betroubaar en nodig",["Gee alles dadelik","Gebruik iemand anders se ID","Ignoreer waarskuwings","Deel jou bank-PIN","Tik jou wagwoord oral","Laai onbekende lêers af"]],
    ["Digitale voetspoor","jy iets op sosiale media plaas","Aanlyn aktiwiteite kan n spoor los",["Dit verdwyn altyd dadelik","Dit verander jou monitor","Dit druk outomaties","Dit maak RAM permanent","Dit sny papier","Dit is net offline"]],
    ["Kommunikasie","jy aanlyn met mense praat","Kommunikeer respekvol en veilig",["Boelie ander mense","Deel privaat data","Stuur spam","Gebruik beledigings","Maak vals profiele","Ignoreer veiligheid"]]
  ];

  let i = 0;
  while(out.length < 250 && i < rows.length * stems.length){
    const row = rows[i % rows.length];
    const stem = stems[Math.floor(i / rows.length) % stems.length];
    const topic = row[0];
    const scenario = row[1];
    const correct = row[2];
    const wrongs = row[3];

    const shift = Math.floor(i / rows.length) % wrongs.length;
    const w1 = wrongs[(shift + 0) % wrongs.length];
    const w2 = wrongs[(shift + 2) % wrongs.length];
    const w3 = wrongs[(shift + 4) % wrongs.length];

    add(topic, stem + scenario + "?", correct, [w1, w2, w3], "Hierdie toets n unieke RTT/CAT konsep.");
    i++;
  }

  return out.slice(0,250);
}

const rawBank = teaeRTTBuild250V1(buildRTTBank());
const bank = rawBank;
/* TEAE_EXPOSE_BANK_FOR_AUDIT_V1 */
window.TEAE_RAW_BANK = rawBank;
window.TEAE_BANK = bank;
window.TEAE_BANK_INFO = {
  raw: rawBank.length,
  unique: bank.length,
  subject: document.title || location.pathname
};
const start = ((sessionNumber(sessionTitle)-1) * 25) % bank.length;
const questions = [];
for(let i=0;i<25;i++){
  questions.push(bank[(start+i) % bank.length]);
}

document.getElementById("titleBox").textContent = sessionTitle;

function render(){
  selected = null;
  marked = false;
  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
  const item = questions[current];

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markAnswer(){
  if(marked) return;
  const item = questions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    score++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg!</span>";
  } else {
    wrongList.push({q:item.text,your:selected,correct:item.correct,explain:item.explain,options:item.options});
    document.getElementById("feedback").innerHTML = "<span class='bad'>☹ Verkeerd. Regte antwoord: " + item.correct + "</span>";
  }

  document.getElementById("explain").textContent = "Verduideliking: " + item.explain;
  document.getElementById("progress").textContent = `Vraag ${current+1} van ${questions.length} | Reg: ${score}`;
}

function nextQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(current < questions.length - 1){
    current++;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  document.getElementById("quizBox").style.display = "none";
  const wrong = questions.length - score;

  let html = `<h2>Sessie klaar</h2>
    <p><b>${sessionTitle}</b></p>
    <p style="font-size:22px;font-weight:900">Punt: ${score} uit ${questions.length}</p>
    <p>Verkeerd: ${wrong}</p>`;

  if(wrongList.length > 0){
    html += "<h3>Verkeerde antwoorde</h3>";
    wrongList.slice(0,10).forEach(w=>{
      html += `<div class="result"><b>Vraag:</b> ${w.q}<br><b>Sy antwoord:</b> ${w.your}<br><b>Reg:</b> ${w.correct}</div>`;
    });

    html += `<div class="result"><span class="bad">Hy moet eers sy verkeerde vrae reg oefen voordat hierdie sessie klaar tel.</span></div>`;
    html += `<button class="orange" onclick="startWrongRetry()">Oefen verkeerde vrae weer</button>`;
  } else {
    if(di !== null && ti !== null){
      localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
    }

    html += `<div class="result"><span class="ok">🎉 Alles eerste keer reg!</span></div>`;
    html += `<button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;
  }

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

function startWrongRetry(){
  if(wrongList.length === 0) return;

  retryMode = true;
  retryOriginalCount = wrongList.length;
  retryCorrectCount = 0;

  retryQuestions = wrongList.map(w => ({
    topic: "Wrong Retry",
    text: w.q,
    correct: w.correct,
    options: shuffle((w.options && w.options.length ? w.options : [w.correct, w.your, "Review answer", "Try again"]).slice()),
    explain: w.explain || "Hierdie vraag was vroeer verkeerd."
  }));

  current = 0;
  score = 0;
  selected = null;
  marked = false;
  wrongList = [];

  document.getElementById("finalResult").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  renderRetry();
}

function renderRetry(){
  selected = null;
  marked = false;

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  const item = retryQuestions[current];

  document.getElementById("progress").textContent =
    "Wrong Retry: " + (current + 1) + " van " + retryQuestions.length + " | Reggemaak: " + retryCorrectCount + " van " + retryOriginalCount;

  document.getElementById("topic").textContent = item.topic;
  document.getElementById("question").textContent = item.text;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("explain").textContent = "";

  const box = document.getElementById("options");
  box.innerHTML = "";

  item.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = function(){
      document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = opt;
    };
    box.appendChild(btn);
  });
}

function markRetryAnswer(){
  if(marked) return;

  const item = retryQuestions[current];

  if(!selected){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Kies eers n antwoord.</span>";
    return;
  }

  marked = true;

  if(selected === item.correct){
    retryCorrectCount++;
    document.getElementById("feedback").innerHTML = "<span class='ok'>⭐ Reg! Hierdie fout val nou weg.</span>";
    retryQuestions.splice(current, 1);
    if(current >= retryQuestions.length){ current = 0; }
  } else {
    document.getElementById("feedback").innerHTML =
      "<span class='bad'>☹ Nog verkeerd. Regte antwoord: " + item.correct + ". Jy gaan hierdie vraag weer kry.</span>";
  }

  document.getElementById("explain").textContent = item.explain;
}

function nextRetryQuestion(){
  if(!marked){
    document.getElementById("feedback").innerHTML = "<span class='bad'>Merk eers die antwoord.</span>";
    return;
  }

  if(retryQuestions.length === 0){
    finishWrongRetry();
    return;
  }

  if(current < retryQuestions.length - 1){ current++; } else { current = 0; }
  renderRetry();
}

function finishWrongRetry(){
  document.getElementById("quizBox").style.display = "none";

  if(di !== null && ti !== null){
    localStorage.setItem("enricoProgramDone_" + di + "_" + ti, "1");
  }

  const html = `<h2>Wrong Retry klaar 🎉</h2>
    <p style="font-size:22px;font-weight:900">Al ${retryOriginalCount} verkeerde vrae is nou reggemaak.</p>
    <p>Mooi Enrico — nou tel hierdie sessie as klaar.</p>
    <div class="result"><span class="ok">Teacher must submit progress to Head Office.</span></div>
    <button class="green" onclick="sendWhatsapp()">WhatsApp Teacher - submit progress</button>`;

  document.getElementById("finalResult").innerHTML = html;
  document.getElementById("finalResult").style.display = "block";
}

const originalMarkAnswer = markAnswer;
markAnswer = function(){
  if(retryMode){ markRetryAnswer(); } else { originalMarkAnswer(); }
};

const originalNextQuestion = nextQuestion;
nextQuestion = function(){
  if(retryMode){ nextRetryQuestion(); } else { originalNextQuestion(); }
};

function sendWhatsapp(){
  const originalWrong = retryOriginalCount > 0 ? retryOriginalCount : (25 - score);

  let msg = `Enrico RTT/CAT update:
Sessie: ${sessionTitle}
Vraagbank: 250 RTT/CAT vrae
Punt: ${25 - originalWrong}/25
Oorspronklik verkeerd: ${originalWrong}`;

  if(retryOriginalCount > 0 && retryQuestions.length === 0){
    msg += `\nWrong Retry: Klaar - ${retryOriginalCount}/${retryOriginalCount} foute reggemaak`;
  } else if(retryOriginalCount === 0){
    msg += `\nWrong Retry: Nie nodig nie - alles eerste keer reg`;
  }

  window.open("https://wa.me/" + Teacher + "?text=" + encodeURIComponent(msg), "_blank");

  setTimeout(function(){
    window.location.href = "enrico_exam_program.html?v=" + Date.now();
  }, 1200);
}

render();
</script>
