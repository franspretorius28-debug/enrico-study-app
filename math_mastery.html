<html lang="af"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wiskunde Mastery Check - Graad 10 Kwartaal 2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;color:#111827}.wrap{max-width:1100px;margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.title{font-size:30px;font-weight:900;color:#123c69}.sub{color:#4b5b70;margin-top:5px;line-height:1.35}.pill{background:#fff7d6;border:1px solid #f1d08b;border-radius:999px;padding:9px 15px;font-size:20px;font-weight:900;white-space:nowrap}.card{background:#fff;border:1px solid #d8e1ec;border-radius:22px;padding:24px;box-shadow:0 8px 26px rgba(0,0,0,.08);margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{border:1px solid #dbe5ef;background:#fff;border-radius:16px;padding:14px;cursor:pointer}.tile:hover{border-color:#0b78bd;box-shadow:0 6px 18px rgba(11,120,189,.12)}.tile b{display:block;margin-bottom:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}button,.back{border:0;border-radius:999px;padding:11px 18px;font-size:16px;font-weight:800;cursor:pointer;background:#0b78bd;color:#fff;text-decoration:none;display:inline-block}.secondary{background:#eef4fa;color:#123c69;border:1px solid #d8e1ec}.danger{background:#d94a4a;color:#fff}select{padding:11px 14px;border-radius:12px;border:1px solid #bfd0df;font-size:15px;font-weight:800;background:#fff}.topic{font-size:16px;margin-bottom:10px;color:#506070}.formula{background:#f3f8ff;border-left:5px solid #0b78bd;padding:14px 16px;border-radius:12px;margin:12px 0 18px;font-size:19px;font-weight:900}.question{font-size:24px;line-height:1.45;margin:14px 0;font-weight:900}.answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}input{width:270px;max-width:100%;font-size:24px;padding:12px 14px;border-radius:12px;border:2px solid #bfd0df}.unit{font-size:20px;font-weight:900}.feedback{margin-top:16px;padding:16px;border-radius:14px;font-size:18px;line-height:1.45;display:none <body><div class="wrap"><div class="top"><div><div class="title">📘 Enrico Wiskunde Geletterdheid</div><div class="sub">Graad 10 Kwartaal 2 • Finansiële dokumente en tariefstelsels • Meting • Kaarte, planne en skaal. 200+ oefenvrae met stappe.</div></div><div class="pill" id="stars">⭐ 0</div></div><div class="card"><div class="row">
  <select id="topicFilter" onchange="changeTopic()"></select>
  <button class="secondary" onclick="startFreshTest()">Begin nuwe toets</button>
  <button class="secondary" onclick="startWrongOnlyTest()">Volgende toets: net verkeerdes</button>
  <button class="secondary" onclick="shuffleQuestions()">Random vrae</button>
  <a class="back danger" href="index.html">Terug na App</a>
</div><div class="grid" id="tiles"></div></div><div class="card"><div class="topic" id="topic"></div><div class="formula" id="formula"></div><div class="question" id="question"></div><div class="answer-row"><span>Antwoord:</span><input id="answer" autocomplete="off"><span class="unit" id="unit"></span></div><div class="row">
  <button onclick="submitAnswer()">Volgende</button>
  <button class="secondary" onclick="skipQuestion()">Los oop</button>
  <button class="secondary" onclick="finishTest()">Klaar met toets</button>
</div>

<div class="feedback" id="feedback"></div>
<div id="reviewArea"></div><div class="score" id="score"></div><div class="bar"><span id="progressBar"></span></div><div class="small" id="meta"></div></div></div>
<script>
const allQuestions=[];function money(n){return Math.round(n*100)/100}function add(topic,level,formula,q,unit,answer,hint,steps){allQuestions.push({topic,level,formula,q,unit,answer:money(answer),hint,steps});}
function build(){
 for(let i=0;i<24;i++){let open=1200+i*85,dep=500+(i%6)*150,pay=100+(i%5)*60,fee=12+(i%4)*3,ans=open+dep-pay-fee;add('Finansiële dokumente','Maklik','Closing balance = opening balance + deposits - payments - bank charges',`Bankstaat: opening balance R${open.toFixed(2)}, deposit R${dep.toFixed(2)}, ATM cash R${pay.toFixed(2)}, bank charge R${fee.toFixed(2)}. Bereken closing balance.`,'R',ans,'Deposits tel by; betalings en bankkoste trek af.',[`R${open.toFixed(2)} + R${dep.toFixed(2)} = R${(open+dep).toFixed(2)}`,`R${(open+dep).toFixed(2)} - R${pay.toFixed(2)} - R${fee.toFixed(2)} = R${ans.toFixed(2)}`]);}
 for(let i=0;i<22;i++){let items=[150+i*9,80+i*4,210+i*7],sub=items.reduce((a,b)=>a+b,0),vat=sub*.15,total=sub+vat;add('Fakture en VAT','Medium','VAT = subtotal × 15%; Total = subtotal + VAT',`Faktuur: items kos R${items[0].toFixed(2)}, R${items[1].toFixed(2)} en R${items[2].toFixed(2)}. VAT is 15%. Bereken total including VAT.`,'R',total,'Tel items op, bereken 15% VAT, tel VAT by.',[`Subtotal = R${sub.toFixed(2)}`,`VAT = R${sub.toFixed(2)} × 15% = R${vat.toFixed(2)}`,`Total = R${total.toFixed(2)}`]);}
 for(let i=0;i<18;i++){let dep=500+(i%4)*250,monthly=185+(i%7)*37,months=12*((i%4)+2),total=dep+monthly*months;add('Krediet en paaiemente','Medium','Hire purchase total = deposit + monthly instalment × number of months',`Deposit R${dep.toFixed(2)}, monthly instalment R${monthly.toFixed(2)} vir ${months/12} jaar. Bereken total amount paid.`,'R',total,'Jare na maande, dan instalment maal maande plus deposit.',[`${months/12} jaar = ${months} maande`,`R${monthly.toFixed(2)} × ${months} = R${(monthly*months).toFixed(2)}`,`Total = R${total.toFixed(2)}`]);}
 for(let i=0;i<16;i++){let units=40+i*8,fixed=55+(i%5)*10,rate=1.35+(i%4)*0.25,total=fixed+units*rate;add('Tariefstelsels','Medium','Total cost = fixed charge + units used × rate per unit',`Elektrisiteitstarief: fixed charge R${fixed.toFixed(2)} en R${rate.toFixed(2)} per kWh. As ${units} kWh gebruik is, bereken totale koste.`,'R',total,'Gebruik vaste fooi plus verbruik.',[`Units cost = ${units} × R${rate.toFixed(2)} = R${(units*rate).toFixed(2)}`,`Total = R${total.toFixed(2)}`]);}
 for(let i=0;i<16;i++){let income=8500+i*700,exp=5200+i*430,profit=income-exp,pm=profit/income*100;add('Wins, verlies en persentasies','Medium','Profit margin = profit ÷ income × 100',`Income is R${income.toFixed(2)} and expenses are R${exp.toFixed(2)}. Bereken profit margin tot 2 desimale.`,'%',pm,'Eers wins, dan wins gedeel deur income maal 100.',[`Profit = R${profit.toFixed(2)}`,`Profit margin = ${profit.toFixed(2)} ÷ ${income.toFixed(2)} × 100 = ${pm.toFixed(2)}%`]);}
 for(let i=0;i<20;i++){let cm=15+i*13;add('Meting: lengte','Maklik','1 m = 100 cm',`Skakel ${cm} cm om na meter.`,'m',cm/100,'cm na m: deel deur 100.',[`${cm} ÷ 100 = ${(cm/100).toFixed(2)}`]);}
 for(let i=0;i<16;i++){let km=1.2+i*.35;add('Meting: lengte','Maklik','1 km = 1000 m',`Skakel ${km.toFixed(2)} km om na meter.`,'m',km*1000,'km na m: maal met 1000.',[`${km.toFixed(2)} × 1000 = ${(km*1000).toFixed(0)}`]);}
 for(let i=0;i<18;i++){let g=250+i*125;add('Meting: massa','Maklik','1 kg = 1000 g',`Skakel ${g} g om na kilogram.`,'kg',g/1000,'g na kg: deel deur 1000.',[`${g} ÷ 1000 = ${(g/1000).toFixed(3)}`]);}
 for(let i=0;i<18;i++){let l=0.35+i*.25;add('Meting: volume en kapasiteit','Maklik','1 litre = 1000 ml',`Skakel ${l.toFixed(2)} litres om na ml.`,'ml',l*1000,'L na ml: maal met 1000.',[`${l.toFixed(2)} × 1000 = ${(l*1000).toFixed(0)}`]);}
 for(let i=0;i<18;i++){let r=2+(i%7),h=5+i,vol=3.14*r*r*h;add('Meting: volume en kapasiteit','Moeilik','Volume of cylinder = πr²h',`Silinder: radius ${r} cm en hoogte ${h} cm. Gebruik π = 3.14. Bereken volume.`,'cm³',vol,'Kry area van sirkelbasis, maal hoogte.',[`πr² = 3.14 × ${r}² = ${(3.14*r*r).toFixed(2)}`,`Volume = ${vol.toFixed(2)}`]);}
 for(let i=0;i<20;i++){let L=4+i,W=2+(i%6),H=3+(i%5),vol=L*W*H;add('Meting: volume en kapasiteit','Medium','Volume rectangular prism = length × width × height',`Reghoekige prisma: lengte ${L} cm, breedte ${W} cm, hoogte ${H} cm. Bereken volume.`,'cm³',vol,'Maal die drie afmetings.',[`${L} × ${W} × ${H} = ${vol}`]);}
 for(let i=0;i<16;i++){let c=-12+i*3,f=c*9/5+32;add('Meting: temperatuur','Medium','°F = (°C × 9/5) + 32',`Skakel ${c}°C om na Fahrenheit.`,'°F',f,'Gebruik die formule vir Celsius na Fahrenheit.',[`(${c} × 9/5) + 32 = ${f.toFixed(2)}`]);}
 for(let i=0;i<16;i++){let a=8+i,b=5+(i%8),area=a*b;add('Meting: oppervlakte','Maklik','Area rectangle = length × width',`Reghoek: lengte ${a} m en breedte ${b} m. Bereken area.`,'m²',area,'Area = lengte maal breedte.',[`${a} × ${b} = ${area}`]);}
 for(let i=0;i<15;i++){let top=6+i,bottom=10+i,height=4+(i%6),area=.5*(top+bottom)*height;add('Meting: oppervlakte','Moeilik','Area trapezium = 1/2 × (a + b) × h',`Trapesium: parallelle kante ${top} cm en ${bottom} cm, hoogte ${height} cm. Bereken area.`,'cm²',area,'Tel parallelle kante by, maal hoogte, deel deur 2.',[`(${top}+${bottom}) = ${top+bottom}`,`1/2 × ${top+bottom} × ${height} = ${area}`]);}
 for(let i=0;i<24;i++){let realM=5+i*.75,scale=[50,75,100,150][i%4],ans=realM*1000/scale;add('Kaarte en skaal','Medium','Plan length = real length ÷ scale',`Werklike lengte is ${realM.toFixed(2)} m. Skaal is 1:${scale}. Bereken plan-lengte in mm.`,'mm',ans,'Skakel meter na mm, dan deel deur skaal.',[`${realM.toFixed(2)} m = ${(realM*1000).toFixed(0)} mm`,`Plan = ${(realM*1000).toFixed(0)} ÷ ${scale} = ${ans.toFixed(2)} mm`]);}
 for(let i=0;i<22;i++){let plan=4+i*.6,scale=[25000,50000,100000][i%3],ans=plan*scale/100000;add('Kaarte en skaal','Medium','Actual distance in km = map cm × scale ÷ 100 000',`Op 'n kaart meet die afstand ${plan.toFixed(1)} cm. Skaal is 1:${scale}. Bereken werklike afstand in km.`,'km',ans,'cm op kaart maal skaal gee cm werklik; deel deur 100 000 vir km.',[`${plan.toFixed(1)} × ${scale} = ${(plan*scale).toFixed(0)} cm`,`km = ${(plan*scale).toFixed(0)} ÷ 100000 = ${ans.toFixed(2)}`]);}
 for(let i=0;i<18;i++){let steps=8+i,each=0.75+(i%5)*.1,ans=steps*each;add('Kaarte en roetes','Maklik','Route distance = number of sections × distance per section',`'n Roete het ${steps} gelyke dele van ${each.toFixed(2)} km elk. Bereken totale afstand.`,'km',ans,'Maal aantal dele met afstand per deel.',[`${steps} × ${each.toFixed(2)} = ${ans.toFixed(2)} km`]);}
 for(let i=0;i<18;i++){let L=6+i,W=4+(i%7),scale=100,planL=L*1000/scale,planW=W*1000/scale;add('Planne en vloerplanne','Medium','Plan measurement = real measurement ÷ scale',`Vloerplan skaal 1:${scale}. Kamer is ${L} m by ${W} m. Wat is die plan-area in mm²?`,'mm²',planL*planW,'Skakel elke werklike maat na plan mm; area = plan lengte × plan breedte.',[`Plan lengte = ${planL}mm`,`Plan breedte = ${planW}mm`,`Area = ${(planL*planW).toFixed(2)} mm²`]);}
 for(let i=0;i<12;i++){let deg=[0,45,90,135,180,225,270,315][i%8],codes={0:1,45:2,90:3,135:4,180:5,225:6,270:7,315:8},names={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};add('Relatiewe posisie','Maklik','Kompasrigtings: N=0, E=90, S=180, W=270',`Watter kompasrigting is ${deg} grade? Tik kode: N=1, NE=2, E=3, SE=4, S=5, SW=6, W=7, NW=8.`,'',codes[deg],'Gebruik die kompas volgorde.',[`Rigting ${deg}° is ${names[deg]}. Kode = ${codes[deg]}`]);}
}
build();let questions=[...allQuestions],current=0,mode='learn',stars=Number(localStorage.getItem('q2stars')||'0'),correctDone=JSON.parse(localStorage.getItem('q2done')||'{}');
function norm(v){return String(v||'').trim().replace(',','.')}function closeEnough(v,a){let n=Number(norm(v));return !Number.isNaN(n)&&Math.abs(n-a)<0.02}function save(){localStorage.setItem('q2stars',stars);localStorage.setItem('q2done',JSON.stringify(correctDone))}
function loadControls(){let topics=['Alle vrae',...new Set(allQuestions.map(x=>x.topic))];document.getElementById('topicFilter').innerHTML=topics.map(t=>`<option>${t}</option>`).join('');let counts={};allQuestions.forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);document.getElementById('tiles').innerHTML=Object.keys(counts).map(t=>`<div class="tile" onclick="pickTopic('${t.replace(/'/g,"\\'")}')"><b>${t}</b><span class="small">${counts[t]} vrae</span></div>`).join('')}
function pickTopic(t){document.getElementById('topicFilter').value=t;changeTopic();window.scrollTo({top:230,behavior:'smooth'})}function changeTopic(){let t=document.getElementById('topicFilter').value,l=document.getElementById('levelFilter').value;questions=allQuestions.filter(q=>(t==='Alle vrae'||q.topic===t)&&(l==='Alle vlakke'||q.level===l));current=0;render()}function shuffleQuestions(){questions.sort(()=>Math.random()-.5);current=0;render()}function setMode(m){mode=m;render()}
function render(){let q=questions[current];if(!q){document.getElementById('question').textContent='Geen vrae vir daardie filter.';return}document.getElementById('topic').innerHTML=`<b>Vraag ${current+1} van ${questions.length}</b> — ${q.topic} • ${q.level}`;document.getElementById('formula').textContent=mode==='learn'?q.formula:'Exam Mode: formule en stappe wys eers wanneer jy vra.';document.getElementById('question').textContent=q.q;document.getElementById('unit').textContent=q.unit;document.getElementById('answer').value='';document.getElementById('feedback').style.display='none';document.getElementById('stars').textContent='⭐ '+stars;document.getElementById('score').textContent=`Mode: ${mode==='learn'?'Learn':'Exam'} | Totaal in bank: ${allQuestions.length} vrae | Hierdie filter: ${questions.length}`;document.getElementById('progressBar').style.width=((current+1)/questions.length*100)+'%';document.getElementById('meta').textContent='Tip: gebruik net nommers. Vir Rand en persentasies, tik net die getal.';setTimeout(()=>document.getElementById('answer').focus(),50)}
function retryQuestion(){document.getElementById('answer').value='';document.getElementById('feedback').style.display='none';document.getElementById('answer').focus()}function nextQuestion(){current=(current+1)%questions.length;render()}function prevQuestion(){current=(current-1+questions.length)%questions.length;render()}function showSteps(){let q=questions[current],fb=document.getElementById('feedback');fb.className='feedback bad';fb.style.display='block';fb.innerHTML='<b>Stappe:</b><div class="steps">'+q.steps.map((s,i)=>(i+1)+'. '+s).join('<br>')+'</div>'}
function checkAnswer(){let q=questions[current],raw=norm(document.getElementById('answer').value),fb=document.getElementById('feedback');if(raw===''||Number.isNaN(Number(raw))){fb.className='feedback bad';fb.style.display='block';fb.innerHTML='Tik net die numeriese antwoord in. Gebruik punt of komma vir desimale.';return}let key=q.topic+'|'+q.q;if(closeEnough(raw,q.answer)){fb.className='feedback good';fb.style.display='block';fb.innerHTML=`✅ Reg! Antwoord: <b>${q.answer}</b> ${q.unit}`;if(!correctDone[key]){stars++;correctDone[key]=true;save()}document.getElementById('stars').textContent='⭐ '+stars;document.getElementById('score').textContent=`Mooi! Jy het ${stars} sterre.`}else{fb.className='feedback bad';fb.style.display='block';fb.innerHTML=mode==='exam'?'❌ Verkeerd. Probeer weer of kliek Wys stappe.':`❌ Nog nie reg nie.<br><b>Hint:</b> ${q.hint}<div class='steps'><b>Stappe:</b><br>${q.steps.map((s,i)=>(i+1)+'. '+s).join('<br>')}</div>`}}
function resetProgress(){if(confirm('Reset alle sterre?')){stars=0;correctDone={};save();render()}}document.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});loadControls();render();
</script><!-- ENRICO_VISUAL_DOCS_START -->

  function chooseVisual(topic, question){
    const t = String(topic || "").toLowerCase();
    const q = String(question || "").toLowerCase();

    if(t.includes("finansiële dokumente") || q.includes("bankstaat") || q.includes("opening balance") || q.includes("closing balance")){
      return makeBankStatement();
    }
    if(t.includes("fakture") || q.includes("invoice") || q.includes("vat")){
      return makeInvoice();
    }
    if(t.includes("krediet") || q.includes("deposit") || q.includes("instalment") || q.includes("cash price")){
      return makeInvoice();
    }
    if(t.includes("tarief")){
      return makeTariffTable();
    }
    if(q.includes("salary") || q.includes("payslip") || q.includes("uif") || q.includes("overtime")){
      return makePayslip();
    }
    if(t.includes("lengte") || t.includes("massa") || t.includes("temperatuur") || q.includes("convert")){
      return makeMeasurement();
    }
    if(t.includes("volume") || q.includes("cylinder") || q.includes("3d")){
      return makeCylinder();
    }
    if(t.includes("kaart") || t.includes("plan") || t.includes("skaal") || q.includes("floor plan") || q.includes("scale")){
      return makeFloorPlan();
    }
    return "";
  }

  function ensureVisualArea(){
    if(document.getElementById("visualDocArea")) return;

    const qEl = document.getElementById("question");
    if(!qEl) return;

    const area = document.createElement("div");
    area.id = "visualDocArea";
    qEl.parentNode.insertBefore(area, qEl);
  }

  function updateVisual(){
    ensureVisualArea();

    const area = document.getElementById("visualDocArea");
    if(!area) return;

    const topic = safeText("topic");
    const question = safeText("question");
    const html = chooseVisual(topic, question);

    if(html){
      area.style.display = "block";
      area.innerHTML = html;
    } else {
      area.style.display = "none";
      area.innerHTML = "";
    }
  }

  const oldRender = window.render;
  if(typeof oldRender === "function"){
    window.render = function(){
      oldRender.apply(this, arguments);
      setTimeout(updateVisual, 50);
    };
  }

  window.addEventListener("load", updateVisual);
  document.addEventListener("DOMContentLoaded", updateVisual);
  setInterval(updateVisual, 700);
})();
</script>

<script id="enrico-next-button-fix-js">
(function(){
  function getAnswerValue(){
    var el = document.getElementById("answer");
    return el ? el.value : "";
  }

  window.submitAnswer = function(){
    try {
      if (typeof window.nextQuestion === "function") {
        window.nextQuestion();
        return;
      }

      if (typeof nextQuestion === "function") {
        nextQuestion();
        return;
      }

      var buttons = Array.from(document.querySelectorAll("button"));
      var nextBtn = buttons.find(function(b){
        return (b.innerText || "").trim().toLowerCase().includes("volgende");
      });

      if(nextBtn){
        nextBtn.blur();
      }
    } catch(e) {
      alert("Volgende fout: " + e.message);
    }
  };

  window.skipQuestion = function(){
    var el = document.getElementById("answer");
    if(el) el.value = "";
    window.submitAnswer();
  };

  window.finishTest = function(){
    try {
      if (typeof window.checkAnswer === "function") {
        window.checkAnswer();
        return;
      }
      if (typeof checkAnswer === "function") {
        checkAnswer();
        return;
      }
      alert("Klaar met toets werk nog nie. Ek moet die engine vervang.");
    } catch(e) {
      alert("Klaar fout: " + e.message);
    }
  };

  document.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;

    var txt = (btn.innerText || "").trim().toLowerCase();

    if(txt === "volgende"){
      e.preventDefault();
      e.stopPropagation();
      window.submitAnswer();
    }

    if(txt === "los op" || txt === "los oop"){
      e.preventDefault();
      e.stopPropagation();
      window.skipQuestion();
    }

    if(txt === "klaar met toets"){
      e.preventDefault();
      e.stopPropagation();
      window.finishTest();
    }
  }, true);
})();
</script>

<script id="enrico-dynamic-bankstaat-js">
(function(){
  function cleanMoney(n){
    return "R" + Number(n).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function parseMoney(text){
    const matches = String(text || "").match(/R\s*[0-9][0-9\s]*([,.][0-9]{1,2})?/gi) || [];
    return matches.map(m => {
      let x = m.replace(/R/gi, "").replace(/\s/g, "").replace(",", ".");
      return Number(x);
    }).filter(n => !Number.isNaN(n));
  }

  function getText(id){
    const el = document.getElementById(id);
    return el ? (el.innerText || el.textContent || "") : "";
  }

  function buildBankStatement(questionText){
    const nums = parseMoney(questionText);

    // Expected order in these questions:
    // opening balance, deposit, ATM cash/payment, bank charge
    const opening = nums[0] ?? 0;
    const deposit = nums[1] ?? 0;
    const atm = nums[2] ?? 0;
    const charge = nums[3] ?? 0;

    const balanceA = opening + deposit;
    const balanceB = balanceA - atm;
    const closing = balanceB - charge;

    return `
      <div class="uct-doc">
        <div class="uct-doc-title">BANKSTAAT</div>
        <div class="uct-doc-sub">Savings account statement — March</div>
        <table class="uct-table">
          <tr>
            <th>Date</th>
            <th>Transaction</th>
            <th class="uct-money">Payment</th>
            <th class="uct-money">Deposit</th>
            <th class="uct-money">Balance</th>
          </tr>
          <tr>
            <td>01/03</td>
            <td>Opening balance</td>
            <td></td>
            <td></td>
            <td class="uct-money">${cleanMoney(opening)}</td>
          </tr>
          <tr>
            <td>03/03</td>
            <td>Deposit</td>
            <td></td>
            <td class="uct-money">${cleanMoney(deposit)}</td>
            <td class="uct-money">(A)</td>
          </tr>
          <tr>
            <td>05/03</td>
            <td>ATM cash</td>
            <td class="uct-money">${cleanMoney(atm)}</td>
            <td></td>
            <td class="uct-money">(B)</td>
          </tr>
          <tr>
            <td>28/03</td>
            <td>Bank charges</td>
            <td class="uct-money">${cleanMoney(charge)}</td>
            <td></td>
            <td class="uct-money">?</td>
          </tr>
        </table>
        <div class="uct-note">
          Werk so: ${cleanMoney(opening)} + ${cleanMoney(deposit)} - ${cleanMoney(atm)} - ${cleanMoney(charge)} = closing balance.
        </div>
      </div>
    `;
  }

  function updateDynamicBankStatement(){
    const topic = getText("topic").toLowerCase();
    const question = getText("question");

    if(!question) return;

    const isBank =
      topic.includes("finansiële dokumente") &&
      question.toLowerCase().includes("bankstaat") &&
      question.toLowerCase().includes("closing balance");

    if(!isBank) return;

    const area = document.getElementById("visualDocArea");
    if(!area) return;

    area.style.display = "block";
    area.innerHTML = buildBankStatement(question);
  }

  // Hard override after old visual script draws its generic statement
  window.addEventListener("load", updateDynamicBankStatement);
  document.addEventListener("DOMContentLoaded", updateDynamicBankStatement);
  setInterval(updateDynamicBankStatement, 250);
})();
</script>
<!-- ENRICO_DYNAMIC_BANKSTAAT_END -->
