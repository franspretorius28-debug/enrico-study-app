    .questionBox{border:1px solid var(--line);border-radius:24px;background:white;padding:16px}

function fmtTime(seconds){ const m=Math.floor(seconds/60); const s=seconds%60; return `${m}:${String(s).padStart(2,"0")}`; }
function filteredQuestions(){ return state.quizMode==="all" ? questions : questions.filter(q=>q.module===state.quizMode); }
function examQuestions(){ return (state.examSet && state.examSet.length ? state.examSet : questions.slice(0,64)); }
function shuffleQuestions(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function examScore(){ return examQuestions().reduce((sum,q,i)=>sum+(state.examAnswers[i]===q.answer?1:0),0); }
function answeredCount(){ return filteredQuestions().filter((_,i)=>state.answers[`${state.quizMode}-${i}`]!==undefined).length; }
function quizScore(){ return filteredQuestions().reduce((sum,q,i)=>sum+(state.answers[`${state.quizMode}-${i}`]===q.answer?1:0),0); }

function startExam(){
  setState({screen:"exam", examStarted:true, examFinished:false, examIndex:0, examAnswers:{}, examSecondsLeft:30*60, examSet:shuffleQuestions(questions).slice(0,64)});
  startTimer();
}
function finishExam(){ if(!state.examFinished){ state.examFinished=true; saveExamResult(); save(); } stopTimer(); render(); }
function startTimer(){
  stopTimer();
  timer=setInterval(()=>{
    if(state.screen!=="exam" || !state.examStarted || state.examFinished) return stopTimer();
    if(state.examSecondsLeft<=0){ finishExam(); return; }
    state.examSecondsLeft -= 1; save(); render();
  },1000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function login(){
  const name = document.getElementById("loginName").value.trim();
  const pin = document.getElementById("loginPin").value.trim();
  if(!name){ alert("Enter student name"); return; }
  if(pin !== STUDENT_PIN){ alert("Wrong PIN"); return; }
  setState({student:name, screen:"dashboard"});
}
function logout(){
  stopTimer();
  setState({student:null, screen:"login", examStarted:false, examFinished:false});
}
function choosePractice(i,o){ state.answers[`${state.quizMode}-${i}`]=o; save(); render(); }
function resetPractice(){ filteredQuestions().forEach((_,i)=>delete state.answers[`${state.quizMode}-${i}`]); setState({showAnswers:false}); }
function chooseExam(o){ state.examAnswers[state.examIndex]=o; save(); render(); }



function moduleLabel(module){
  const labels = {
    controls: "Vehicle Controls",
    defensive: "Defensive Driving",
    signs: "Road Signs",
    markings: "Road Markings",
    rules: "Rules of the Road",
    overview: "Overview"
  };
  return labels[module] || module || "General";
}

  wrongQuestionsList.forEach(q=>{
    const label = moduleLabel(q.module);
    counts[label] = (counts[label] || 0) + 1;
  });
  return Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${k} (${v})`)
    .join(", ");
}
function sendResultToParent(payload){
  if(!RESULTS_WEB_APP_URL || RESULTS_WEB_APP_URL.indexOf("script.google.com") === -1){
    state.lastSyncStatus = "Results URL not configured";
    save();
    return;
  }
  state.lastSyncStatus = "Sending result...";
  save();
  fetch(RESULTS_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).then(()=>{
    state.lastSyncStatus = "Result sent to parent sheet";
    save();
    render();
  }).catch((err)=>{
    state.lastSyncStatus = "Could not send result. It is saved on this device.";
    save();
    render();
  });
}

function saveExamResult(){
  const eq = examQuestions();
  const score = examScore();
  const pct = eq.length ? Math.round(score / eq.length * 100) : 0;
  const wrongItems = [];
  const wrongKeys = [];
  eq.forEach((q,i)=>{
    if(state.examAnswers[i] !== q.answer){
      const key = q.id || q.q;
      state.wrongBank[key] = q;
      wrongKeys.push(key);
      wrongItems.push(q);
    }
  });
  const weakAreas = calculateWeakAreas(wrongItems);
  const wrongQuestionsText = wrongItems
    .slice(0, 40)
    .map(q => `[${moduleLabel(q.module)}] ${q.q} | Correct: ${q.options[q.answer]}`)
    .join("\n");

  const result = {
    date: new Date().toLocaleString(),
    score,
    total: eq.length,
    percent: pct,
    passed: pct >= 75,
    wrong: wrongItems.length,
    weakAreas
  };
  state.scoreHistory = [result, ...(state.scoreHistory || [])].slice(0, 20);
  state.lastSyncStatus = "Saved locally. Sending to parent sheet...";
  save();

  sendResultToParent({
    student: state.student || "Enrico",
    subject: "K53",
    mode: "Exam",
    score,
    total: eq.length,
    percent: pct,
    passed: pct >= 75,
    wrongCount: wrongItems.length,
    weakAreas: weakAreas || "None",
    wrongQuestions: wrongQuestionsText || "None",
    device: navigator.userAgent || ""
  });
}

function catTaskKey(idx){ return "catTask_" + idx; }

function catTaskState(idx){
  if(!state.catTaskProgress) state.catTaskProgress = {};
  const key = catTaskKey(idx);
  if(!state.catTaskProgress[key]){
    state.catTaskProgress[key] = {steps:{}, status:"Not started", note:""};
  }
  return state.catTaskProgress[key];
}

function catToggleTaskStep(idx, stepIdx){
  const t = catTaskState(idx);
  t.steps[stepIdx] = !t.steps[stepIdx];
  const task = catQ2Tasks[idx];
  const doneCount = Object.values(t.steps).filter(Boolean).length;
  if(doneCount === 0) t.status = "Not started";
  else if(doneCount < task.steps.length) t.status = "Busy";
  else t.status = "Completed";
  save(); render();
}

function catSetTaskStatus(idx, status){
  const t = catTaskState(idx);
  t.status = status;
  t.reviewedAt = new Date().toLocaleString();
  save(); render();

  if(status === "Parent approved" || status === "Needs fix"){
    const task = catQ2Tasks[idx];
    const doneCount = Object.values(t.steps || {}).filter(Boolean).length;
    sendResultToParent({
      student: state.student || "Enrico",
      subject: "RTT / CAT",
      mode: "Practical Task",
      task: task.title,
      module: task.module,
      status: status,
      score: doneCount,
      total: task.steps.length,
      percent: Math.round(doneCount / task.steps.length * 100),
      passed: status === "Parent approved",
      wrongCount: status === "Needs fix" ? 1 : 0,
      weakAreas: status === "Needs fix" ? task.module : "None",
      wrongQuestions: status === "Needs fix" ? "Practical task needs correction: " + task.title : "None",
      device: navigator.userAgent || ""
    });
  }
}

function catTaskStatusClass(status){
  if(status === "Parent approved") return "active";
  if(status === "Needs fix") return "";
  if(status === "Completed") return "active";
  return "";
}

function catTaskModuleId(task){
  if(task.module.indexOf("3.5") === 0) return "m35";
  if(task.module.indexOf("3.6") === 0) return "m36";
  if(task.module.indexOf("4.1") === 0) return "m41";
  if(task.module.indexOf("4.2") === 0) return "m42";
  if(task.module.indexOf("2.1") === 0) return "m21";
  if(task.module.indexOf("6.1") === 0) return "m61";
  if(task.module.indexOf("1.6") === 0) return "m16";
  if(task.module.indexOf("1.7") === 0) return "m17";
  return "all";
}

function catTasksForCurrentModule(){
  const mod = state.catModule || "all";
  if(mod === "all") return catQ2Tasks.map(function(t,idx){ return {task:t, idx:idx}; });
  return catQ2Tasks
    .map(function(t,idx){ return {task:t, idx:idx}; })
    .filter(function(x){ return catTaskModuleId(x.task) === mod; });
}

function catTasksHTML(){
  const visibleTasks = catTasksForCurrentModule();

  let html = '<div class="card"><div class="row space"><div><h2>🧰 Practical Tasks</h2><p class="muted">Net die tasks vir die module wat gekies is wys hier. Kies Mixed Term 2 Exam om alles te sien.</p></div><span class="pill active">Term 2</span></div>';

  if(!visibleTasks.length){
    html += '<div class="note" style="margin-top:14px">Daar is nog nie practical tasks vir hierdie module nie. Hierdie module is hoofsaaklik teorie en practice questions.</div></div>';
    return html;
  }

  html += '<div class="grid" style="margin-top:14px">';

  visibleTasks.forEach(function(x){
    const t = x.task;
    const idx = x.idx;
    const progress = catTaskState(idx);
    const doneCount = Object.values(progress.steps || {}).filter(Boolean).length;
    const percent = Math.round(doneCount / t.steps.length * 100);
    const openAttr = idx === visibleTasks[0].idx ? " open" : "";

    html += '<details class="questionBox"' + openAttr + '>';

    html += '</div>';
    html += '<div class="progress" style="margin-top:12px"><div style="width:' + percent + '%"></div></div>';
    html += '<div class="muted" style="margin-top:8px">Progress: ' + doneCount + '/' + t.steps.length + ' steps completed (' + percent + '%)</div>';
    html += '</summary>';

    html += '<div style="margin-top:14px;display:grid;gap:10px">';
    t.steps.forEach(function(step,stepIdx){
      const checked = progress.steps && progress.steps[stepIdx] ? "checked" : "";
      html += '<label class="note" style="display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;margin:0">';

    html += '</details>';
  });

  html += '</div></div>';
  return html;

function startRttExam(){
  state.selectedSubject = "cat";
  state.screen = "rtt_exam";
  state.rttExamFinished = false;
  state.rttExamAnswers = {};
  state.rttExamSet = shuffleQuestions(catQ2Questions).slice(0, 20);
  save();
  render();
}

function rttExamQuestions(){
  return state.rttExamSet && state.rttExamSet.length ? state.rttExamSet : catQ2Questions.slice(0,20);
}

function rttExamChoose(i, oi){
  if(!state.rttExamAnswers) state.rttExamAnswers = {};
  state.rttExamAnswers[i] = oi;
  save();
  render();
}

function rttExamScore(){
  const qs = rttExamQuestions();
  let score = 0;
  qs.forEach(function(q,i){
    if((state.rttExamAnswers || {})[i] === q.a) score++;
  });
  return score;
}

function finishRttExam(){
  state.rttExamFinished = true;
  const qs = rttExamQuestions();
  const theoryScore = rttExamScore();
  const wordResult = wordSimResult();
  const totalScore = theoryScore + wordResult.score;
  const totalMarks = qs.length + wordResult.total;
  const pct = Math.round(totalScore / totalMarks * 100);

  state.rttLastResult = {
    theoryScore: theoryScore,
    theoryTotal: qs.length,
    practicalScore: wordResult.score,
    practicalTotal: wordResult.total,
    totalScore: totalScore,
    totalMarks: totalMarks,
    percent: pct,
    passed: pct >= 70
  };

  save();
  render();

  sendResultToParent({
    student: state.student || "Enrico",
    subject: "RTT / CAT",
    mode: "Term 2 Exam",
    score: totalScore,
    total: totalMarks,
    percent: pct,
    passed: pct >= 70,
    wrongCount: totalMarks - totalScore,
    weakAreas: wordResult.missing.length ? wordResult.missing.join(", ") : "Check theory mistakes",
    wrongQuestions: "RTT Term 2 exam completed. Theory: " + theoryScore + "/" + qs.length + ", Word practical: " + wordResult.score + "/" + wordResult.total,
    device: navigator.userAgent || ""
  });
}

function resetRttExam(){
  state.rttExamFinished = false;
  state.rttExamAnswers = {};
  state.rttExamSet = [];
  state.rttLastResult = null;
  save();
  render();
}

var rttExamTimerHandleV2 = null;

function startRttExam(){
  state.selectedSubject = "cat";
  state.screen = "rtt_exam";
  state.rttExamFinished = false;
  state.rttExamAnswers = {};
  state.rttExamSet = shuffleQuestions(catQ2Questions).slice(0, 60);
  state.rttExamSecondsLeft = 60 * 60;
  state.rttLastResult = null;
  save();
  startRttExamTimer();
  render();
}

function rttExamQuestions(){
  return state.rttExamSet && state.rttExamSet.length ? state.rttExamSet : catQ2Questions.slice(0, 60);
}

function startRttExamTimer(){
  if(rttExamTimerHandleV2) return;
  rttExamTimerHandleV2 = setInterval(function(){
    if(state.rttExamFinished){
      clearInterval(rttExamTimerHandleV2);
      rttExamTimerHandleV2 = null;
      return;
    }
    if(typeof state.rttExamSecondsLeft !== "number") state.rttExamSecondsLeft = 60 * 60;
    state.rttExamSecondsLeft = Math.max(0, state.rttExamSecondsLeft - 1);
    save();

    if(state.rttExamSecondsLeft <= 0){
      clearInterval(rttExamTimerHandleV2);
      rttExamTimerHandleV2 = null;
      finishRttExam();
      return;
    }

    if(state.screen === "rtt_exam") render();
  }, 1000);
}

function rttExamTimeText(){
  const s = typeof state.rttExamSecondsLeft === "number" ? state.rttExamSecondsLeft : 60 * 60;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

function rttExamChoose(i, oi){
  if(!state.rttExamAnswers) state.rttExamAnswers = {};
  state.rttExamAnswers[i] = oi;
  save();
  render();
}

function rttExamScore(){
  const qs = rttExamQuestions();
  let score = 0;
  qs.forEach(function(q,i){
    if((state.rttExamAnswers || {})[i] === q.a) score++;
  });
  return score;
}

function finishRttExam(){
  state.rttExamFinished = true;
  if(rttExamTimerHandleV2){
    clearInterval(rttExamTimerHandleV2);
    rttExamTimerHandleV2 = null;
  }

  const qs = rttExamQuestions();
  const theoryScore = rttExamScore();
  const wordResult = wordSimResult();
  const excelResultNow = excelResult();

  const totalScore = theoryScore + wordResult.score + excelResultNow.score;
  const totalMarks = qs.length + wordResult.total + excelResultNow.total;
  const pct = Math.round(totalScore / totalMarks * 100);

  state.rttLastResult = {
    theoryScore: theoryScore,
    theoryTotal: qs.length,
    wordScore: wordResult.score,
    wordTotal: wordResult.total,
    excelScore: excelResultNow.score,
    excelTotal: excelResultNow.total,
    practicalScore: wordResult.score + excelResultNow.score,
    practicalTotal: wordResult.total + excelResultNow.total,
    totalScore: totalScore,
    totalMarks: totalMarks,
    percent: pct,
    passed: pct >= 70
  };

  save();
  render();

  sendResultToParent({
    student: state.student || "Enrico",
    subject: "RTT / CAT",
    mode: "Term 2 Exam",
    score: totalScore,
    total: totalMarks,
    percent: pct,
    passed: pct >= 70,
    wrongCount: totalMarks - totalScore,
    weakAreas: "Theory + Word + Excel practical checked",
    wrongQuestions: "RTT Term 2 exam completed. Theory: " + theoryScore + "/" + qs.length + ", Word practical: " + wordResult.score + "/" + wordResult.total + ", Excel practical: " + excelResultNow.score + "/" + excelResultNow.total,

}

        {product:"", qty:"", price:"", formula:""},

      ],
      sumFormula:"",
      avgFormula:"",
      maxFormula:"",
      marked:false
    };
  }
  return state.excelSim;
}

function excelSet(row, field, value){
  const e = ensureExcelSim();
  e.rows[row][field] = value;
  e.marked = false;
  save();
}

function excelSetSummary(field, value){
  const e = ensureExcelSim();
  e[field] = value;
  e.marked = false;
  save();
}

function excelExpectedFormula(row){ return excelFormulaHint(row); }

function excelNum(v){
  const n = parseFloat(String(v || "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}

function excelRowTotal(row){
  const e = ensureExcelSim();
  const b = excelNum(e.rows[row].qty);
  const c = excelNum(e.rows[row].price);
  return excelFormulaSymbol() === "+" ? (b + c) : (b * c);
}

function excelGrandTotal(){
  const e = ensureExcelSim();
  let total = 0;
  e.rows.forEach(function(r,i){ total += excelRowTotal(i); });
  return total;
}

function excelAverage(){
  const e = ensureExcelSim();
  return e.rows.length ? excelGrandTotal() / e.rows.length : 0;
}

function excelMax(){
  const e = ensureExcelSim();
  let max = 0;
  e.rows.forEach(function(r,i){ max = Math.max(max, excelRowTotal(i)); });
  return max;
}

function excelMark(){
  const e = ensureExcelSim();

function excelResult(){
  const e = ensureExcelSim();
  const filledProducts = e.rows.filter(function(r){ return String(r.product || "").trim().length > 0; }).length;
  const qtyPrices = e.rows.filter(function(r){ return excelNum(r.qty) > 0 && excelNum(r.price) > 0; }).length;
  const formulas = e.rows.filter(function(r,i){ return String(r.formula || "").toUpperCase().replace(/\s/g,"") === excelExpectedFormula(i); }).length;

  const checks = [
    {ok: filledProducts >= 5, text:"Products is ingevul"},

    {ok: String(e.maxFormula||"").toUpperCase().replace(/\s/g,"") === "=MAX(E2:E6)", text:"MAX formule is korrek"}
  ];
  const score = checks.filter(function(c){ return c.ok; }).length;
  const total = checks.length;
  const percent = Math.round(score / total * 100);
  return {
    checks: checks,
    score: score,
    total: total,
    percent: percent,
    passed: percent >= 70,
    missing: checks.filter(function(c){ return !c.ok; }).map(function(c){ return c.text; })
  };
}

// === WORD EDITABLE TABLE V1 ===
function wordEnsureTableCells(){
  const w = ensureWordSim();
  if(!w.tableCells){
    w.tableCells = [
      ["", "", ""],
      ["", "", ""],
      ["", "", ""],
      ["", "", ""]
    ];
  }
  return w.tableCells;
}

function wordTableSet(r, c, value){
  const w = ensureWordSim();
  wordEnsureTableCells();
  w.tableCells[r][c] = value;
  w.marked = false;
  save();
}

function wordTableCell(r, c){
  const cells = wordEnsureTableCells();
  return cells[r] && cells[r][c] ? cells[r][c] : "";
}

function wordTableHasContent(){
  const cells = wordEnsureTableCells();
  let count = 0;
  cells.forEach(function(row){
    row.forEach(function(cell){
      if(String(cell || "").trim().length > 0) count++;
    });
  });
  return count >= 4;
}

function wordEditableTableHTML(){
  wordEnsureTableCells();
  let html = '<table class="wordFakeTable editableWordTable">';
  for(let r=0; r<4; r++){
    html += '<tr>';
    for(let c=0; c<3; c++){
      const tag = r === 0 ? "th" : "td";
      const ph = r === 0 ? (c === 0 ? "Item" : c === 1 ? "Type" : "Example") : "";
      html += '<' + tag + '><input class="wordTableInput" placeholder="' + ph + '" value="' + esc(wordTableCell(r,c)) + '" oninput="wordTableSet(' + r + ',' + c + ',this.value)"></' + tag + '>';
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}
// Override marking so table practicals must have table content
function wordSimResult(){
  const w = ensureWordSim();
  const task = (typeof currentWordTaskV2 === "function") ? currentWordTaskV2() : null;
  const taskId = task ? task.id : "";

  const needsTable = taskId === "word_table" || taskId === "word_hardware_software" || taskId === "word_mixed_exam";
  const needsColumns = taskId === "word_columns";
  const needsLandscape = taskId === "word_landscape";

  const checks = [
    {ok: w.title.trim().length >= 5, text:"Opskrif is ingevul"},
    {ok: w.boldHeading, text:"Opskrif is bold gemaak"},
    {ok: w.centeredHeading || taskId === "word_columns" || taskId === "word_landscape", text:"Opskrif is gesentreer waar nodig"},
    {ok: w.body.trim().length >= 80, text:"Minstens twee kort paragrawe is ingevul"},
    {ok: w.header.trim().length >= 3, text:"Header is ingevul"},
    {ok: w.footer.trim().length >= 3 || w.pageNumbers, text:"Footer of page number is ingevul"}
  ];

  if(needsTable){
    checks.push({ok: !!w.table, text:"Table is inserted"});
    checks.push({ok: !!w.table && wordTableHasContent(), text:"Table is ingevul"});
  } else if(needsColumns){
    checks.push({ok: !!w.columns, text:"Columns is gebruik"});
  } else if(needsLandscape){
    checks.push({ok: !!w.landscape, text:"Landscape orientation is gebruik"});
  } else {
    checks.push({ok: w.landscape || w.columns || w.table, text:"Minstens een gevorderde Word-funksie is gebruik"});
  }

  const score = checks.filter(function(c){ return c.ok; }).length;
  const total = checks.length;
  const percent = Math.round(score / total * 100);
  return {
    checks: checks,
    score: score,
    total: total,
    percent: percent,
    passed: percent >= 70,
    missing: checks.filter(function(c){ return !c.ok; }).map(function(c){ return c.text; })
  };
}
