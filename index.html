    .space{justify-content:space-between}
    .card{background:white;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,.05)}

function fmtTime(seconds){ const m=Math.floor(seconds/60); const s=seconds%60; return `${m}:${String(s).padStart(2,"0")}`; }
function filteredQuestions(){ return state.quizMode==="all" ? questions : questions.filter(q=>q.module===state.quizMode); }
function examQuestions(){ return (state.examSet && state.examSet.length ? state.examSet : questions.slice(0,64)); }
function shuffleQuestions(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function examScore(){ return examQuestions().reduce((sum,q,i)=>sum+(state.examAnswers[i]===q.answer?1:0),0); }
function answeredCount(){ return filteredQuestions().filter((_,i)=>state.answers[`${state.quizMode}-${i}`]!==undefined).length; }
function quizScore(){ return filteredQuestions().reduce((sum,q,i)=>sum+(state.answers[`${state.quizMode}-${i}`]===q.answer?1:0),0); }

  setState({screen:"exam", examStarted:true, examFinished:false, examIndex:0, examAnswers:{}, examSecondsLeft:30*60, examSet:shuffleQuestions(questions).slice(0,64)});

}
function finishExam(){ if(!state.examFinished){ state.examFinished=true; saveExamResult(); save(); } stopTimer(); render(); }
function startTimer(){
  stopTimer();
  timer=setInterval(()=>{
    if(state.screen!=="exam" || !state.examStarted || state.examFinished) return stopTimer();
    if(state.examSecondsLeft<=0){ finishExam(); return; }
    state.examSecondsLeft -= 1; save(); render();
  },1000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function moduleLabel(module){
  const labels = {
    controls: "Vehicle Controls",
    defensive: "Defensive Driving",
    signs: "Road Signs",
    markings: "Road Markings",
    rules: "Rules of the Road",
    overview: "Overview"
  };
  return labels[module] || module || "General";
}
function calculateWeakAreas(wrongQuestionsList){
  const counts = {};
  wrongQuestionsList.forEach(q=>{
    const label = moduleLabel(q.module);
    counts[label] = (counts[label] || 0) + 1;
  });
  return Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`${k} (${v})`)
    .join(", ");
}
function sendResultToParent(payload){
  if(!RESULTS_WEB_APP_URL || RESULTS_WEB_APP_URL.indexOf("script.google.com") === -1){
    state.lastSyncStatus = "Results URL not configured";
    save();
    return;
  }
  state.lastSyncStatus = "Sending result...";
  save();
  fetch(RESULTS_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).then(()=>{
    state.lastSyncStatus = "Result sent to parent sheet";
    save();
    render();
  }).catch((err)=>{
    state.lastSyncStatus = "Could not send result. It is saved on this device.";
    save();
    render();
  });
}

function saveExamResult(){
  const eq = examQuestions();
  const score = examScore();
  const pct = eq.length ? Math.round(score / eq.length * 100) : 0;
  const wrongItems = [];
  const wrongKeys = [];
  eq.forEach((q,i)=>{
    if(state.examAnswers[i] !== q.answer){
      const key = q.id || q.q;
      state.wrongBank[key] = q;
      wrongKeys.push(key);
      wrongItems.push(q);
    }
  });
  const weakAreas = calculateWeakAreas(wrongItems);
  const wrongQuestionsText = wrongItems
    .slice(0, 40)
    .map(q => `[${moduleLabel(q.module)}] ${q.q} | Correct: ${q.options[q.answer]}`)
    .join("\n");

  const result = {
    date: new Date().toLocaleString(),
    score,
    total: eq.length,
    percent: pct,
    passed: pct >= 75,
    wrong: wrongItems.length,
    weakAreas
  };
  state.scoreHistory = [result, ...(state.scoreHistory || [])].slice(0, 20);
  state.lastSyncStatus = "Saved locally. Sending to parent sheet...";
  save();

  sendResultToParent({
    student: state.student || "Enrico",
    subject: "K53",
    mode: "Exam",
    score,
    total: eq.length,
    percent: pct,
    passed: pct >= 75,
    wrongCount: wrongItems.length,
    weakAreas: weakAreas || "None",
    wrongQuestions: wrongQuestionsText || "None",
    device: navigator.userAgent || ""
  });
}

function questionHTML(q,i){
  const key=`${state.quizMode}-${i}`; const chosen=state.answers[key]; const reveal=state.showAnswers||state.parentMode;
  return `<div class="questionBox">${imageHTML(q)}<b>${i+1}. ${esc(q.q)}</b><div class="optionGrid" style="margin-top:12px">
    ${q.options.map((o,oi)=>{
      let cls="optionBtn";
      if(chosen===oi && !reveal) cls+=" selected";
      if(reveal && q.answer===oi) cls+=" correct";
      if(reveal && chosen===oi && q.answer!==oi) cls+=" wrong";
      return `<button class="${cls}" onclick="choosePractice(${i},${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`;
    }).join("")}
  </div>${reveal?`<div class="note" style="margin-top:12px"><b>Explanation:</b> ${esc(q.why)}</div>`:""}</div>`;
}
function examHTML(){
  const eq=examQuestions(); const q=eq[state.examIndex]; const score=examScore(); const pct=eq.length?Math.round(score/eq.length*100):0; const passed=pct>=75;
  return `${topbar()}<div class="wrap"><div class="card">
    <div class="row space"><div><h2>🏆 K53 Exam Mode</h2><p class="muted">One question at a time, timer, finish button, score and saved wrong questions.</p></div>
      <div class="row">${!state.examStarted?`<button class="btn" onclick="startExam()">Start Exam</button>`:""}${state.examStarted&&!state.examFinished?`<button class="btn secondary" onclick="finishExam()">Finish</button>`:""}</div>
    </div>
    ${!state.examStarted?`<div class="note" style="margin-top:14px"><b>Instructions:</b><br>Read each question carefully. Choose only one answer. When you are done, click Finish to see your score.</div>`:""}
    ${state.examStarted && q && !state.examFinished ? `<div class="grid" style="margin-top:14px">
      <div class="examHeader"><b>Question ${state.examIndex+1} of ${eq.length}</b><b>Answered: ${Object.keys(state.examAnswers).length}/${eq.length}</b><div class="timer">${fmtTime(state.examSecondsLeft)}</div></div>
      <div class="questionBox">${imageHTML(q)}<h2>${esc(q.q)}</h2><div class="optionGrid" style="margin-top:14px">${q.options.map((o,oi)=>`<button class="optionBtn ${state.examAnswers[state.examIndex]===oi?'selected':''}" onclick="chooseExam(${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join("")}</div></div>
      <div class="row space"><button class="btn secondary" ${state.examIndex===0?'disabled':''} onclick="setState({examIndex:Math.max(0,state.examIndex-1)})">Previous</button>${state.examIndex<eq.length-1?`<button class="btn" onclick="setState({examIndex:Math.min(${eq.length-1},state.examIndex+1)})">Next</button>`:`<button class="btn" onclick="finishExam()">Finish Exam</button>`}</div>
    </div>`:""}
    ${state.examStarted && state.examFinished ? `<div class="grid" style="margin-top:14px">
      <div class="card ${passed?'resultGood':'resultBad'}" style="text-align:center"><div style="font-size:42px;font-weight:900">${score}/${eq.length}</div><h2>${pct}% — ${passed?"PASS":"TRY AGAIN"}</h2><p>K53 practice score. Each exam randomly selects 64 questions from the larger practice bank.</p><div class="syncBox" style="margin-top:12px"><b>Parent result sync:</b> ${state.lastSyncStatus || "Not sent yet"}</div></div>
      ${eq.map((qq,i)=>{
        const chosen=state.examAnswers[i]; const correct=chosen===qq.answer;
        return `<div class="questionBox ${correct?'resultGood':'resultBad'}">${imageHTML(qq)}<b>${i+1}. ${esc(qq.q)}</b><div>Your answer: ${chosen===undefined?"None":`${String.fromCharCode(65+chosen)}. ${esc(qq.options[chosen])}`}</div>${!correct?`<div><b>Correct answer:</b> ${String.fromCharCode(65+qq.answer)}. ${esc(qq.options[qq.answer])}</div>`:""}<div class="muted">${esc(qq.why)}</div></div>`;
      }).join("")}
    </div>`:""}
  </div></div>`;
}

    "Explain WAN in your own words.",
    "Write 3 benefits of a network.",
    "Write the difference between wired and wireless networks."
  ]},
  {type:"Theory", module:"6.1 Strategie vir probleemoplossing", title:"Problem-solving task", steps:[
    "Read a problem carefully.",
    "Write what information is given.",
    "Write what information is needed.",
    "Decide which program is best to use: Word or Excel.",
    "Create a simple solution and check if it answers the problem."
  ]}
];

function catTaskKey(idx){ return "catTask_" + idx; }

function catTaskState(idx){
  if(!state.catTaskProgress) state.catTaskProgress = {};
  const key = catTaskKey(idx);
  if(!state.catTaskProgress[key]){
    state.catTaskProgress[key] = {steps:{}, status:"Not started", note:""};
  }
  return state.catTaskProgress[key];
}

function catToggleTaskStep(idx, stepIdx){
  const t = catTaskState(idx);
  t.steps[stepIdx] = !t.steps[stepIdx];
  const task = catQ2Tasks[idx];
  const doneCount = Object.values(t.steps).filter(Boolean).length;
  if(doneCount === 0) t.status = "Not started";
  else if(doneCount < task.steps.length) t.status = "Busy";
  else t.status = "Completed";
  save(); render();
}

function catSetTaskStatus(idx, status){
  const t = catTaskState(idx);
  t.status = status;
  t.reviewedAt = new Date().toLocaleString();
  save(); render();

  if(status === "Parent approved" || status === "Needs fix"){
    const task = catQ2Tasks[idx];
    const doneCount = Object.values(t.steps || {}).filter(Boolean).length;
    sendResultToParent({
      student: state.student || "Enrico",
      subject: "RTT / CAT",
      mode: "Practical Task",
      task: task.title,
      module: task.module,
      status: status,
      score: doneCount,
      total: task.steps.length,
      percent: Math.round(doneCount / task.steps.length * 100),
      passed: status === "Parent approved",
      wrongCount: status === "Needs fix" ? 1 : 0,
      weakAreas: status === "Needs fix" ? task.module : "None",
      wrongQuestions: status === "Needs fix" ? "Practical task needs correction: " + task.title : "None",
      device: navigator.userAgent || ""
    });
  }
}

function catTaskStatusClass(status){
  if(status === "Parent approved") return "active";
  if(status === "Needs fix") return "";
  if(status === "Completed") return "active";
  return "";
}

function catTaskModuleId(task){
  if(task.module.indexOf("3.5") === 0) return "m35";
  if(task.module.indexOf("3.6") === 0) return "m36";
  if(task.module.indexOf("4.1") === 0) return "m41";
  if(task.module.indexOf("4.2") === 0) return "m42";
  if(task.module.indexOf("2.1") === 0) return "m21";
  if(task.module.indexOf("6.1") === 0) return "m61";
  if(task.module.indexOf("1.6") === 0) return "m16";
  if(task.module.indexOf("1.7") === 0) return "m17";
  return "all";
}

function catTasksForCurrentModule(){
  const mod = state.catModule || "all";
  if(mod === "all") return catQ2Tasks.map(function(t,idx){ return {task:t, idx:idx}; });
  return catQ2Tasks
    .map(function(t,idx){ return {task:t, idx:idx}; })
    .filter(function(x){ return catTaskModuleId(x.task) === mod; });
}

function catTasksHTML(){
  const visibleTasks = catTasksForCurrentModule();

  let html = '<div class="card"><div class="row space"><div><h2>🧰 Practical Tasks</h2><p class="muted">Net die tasks vir die module wat gekies is wys hier. Kies Mixed Term 2 Exam om alles te sien.</p></div><span class="pill active">Term 2</span></div>';

  if(!visibleTasks.length){
    html += '<div class="note" style="margin-top:14px">Daar is nog nie practical tasks vir hierdie module nie. Hierdie module is hoofsaaklik teorie en practice questions.</div></div>';
    return html;
  }

  html += '<div class="grid" style="margin-top:14px">';

  visibleTasks.forEach(function(x){
    const t = x.task;
    const idx = x.idx;
    const progress = catTaskState(idx);
    const doneCount = Object.values(progress.steps || {}).filter(Boolean).length;
    const percent = Math.round(doneCount / t.steps.length * 100);
    const openAttr = idx === visibleTasks[0].idx ? " open" : "";

    html += '<details class="questionBox"' + openAttr + '>';
    html += '<summary style="cursor:pointer;list-style:none">';
    html += '<div class="row space">';
    html += '<div><b>' + esc(t.title) + '</b><br><span class="muted">' + esc(t.type + " • " + t.module) + '</span></div>';
    html += '<div class="row"><span class="pill">' + esc(t.type) + '</span><span class="pill ' + catTaskStatusClass(progress.status) + '">' + esc(progress.status) + '</span></div>';
    html += '</div>';
    html += '<div class="progress" style="margin-top:12px"><div style="width:' + percent + '%"></div></div>';
    html += '<div class="muted" style="margin-top:8px">Progress: ' + doneCount + '/' + t.steps.length + ' steps completed (' + percent + '%)</div>';
    html += '</summary>';

    html += '<div style="margin-top:14px;display:grid;gap:10px">';
    t.steps.forEach(function(step,stepIdx){
      const checked = progress.steps && progress.steps[stepIdx] ? "checked" : "";
      html += '<label class="note" style="display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;margin:0">';
      html += '<input type="checkbox" ' + checked + ' onchange="catToggleTaskStep(' + idx + ',' + stepIdx + ')" style="margin-top:4px">';
      html += '<span><b>Step ' + (stepIdx+1) + ':</b> ' + esc(step) + '</span>';
      html += '</label>';
    });
    html += '</div>';

    html += '<div class="row" style="margin-top:14px">';
    html += '<button class="btn secondary" onclick="catSetTaskStatus(' + idx + ',\'Completed\')">Mark Complete</button>';
    html += '<button class="btn" onclick="catSetTaskStatus(' + idx + ',\'Parent approved\')">Parent Approved</button>';
    html += '<button class="btn secondary" onclick="catSetTaskStatus(' + idx + ',\'Needs fix\')">Needs Fix</button>';
    html += '</div>';

    if(progress.reviewedAt){
      html += '<div class="note" style="margin-top:12px"><b>Last reviewed:</b> ' + esc(progress.reviewedAt) + '</div>';
    }

    html += '</details>';
  });

  html += '</div></div>';
  return html;
}

function catFilteredQuestions(){
  const mod = state.catModule || "all";
  if(mod==="all") return catQ2Questions.slice();
  return catQ2Questions.filter(function(q){ return q.m===mod; });
}
function catChoose(i, oi){
  if(!state.catAnswers) state.catAnswers = {};
  const mod = state.catModule || "all";
  state.catAnswers[mod + "-" + i] = oi;
  save(); render();
}
function catReset(){
  state.catAnswers = {};
  state.catShowAnswers = false;
  save(); render();
}
function catScore(){
  const qs = catFilteredQuestions();
  const mod = state.catModule || "all";
  let score = 0;
  qs.forEach(function(q,i){
    if((state.catAnswers||{})[mod + "-" + i] === q.a) score++;
  });
  return score;
}
function catExamHTML(){
  state.catModule = state.catModule || "all";
  const qs = catFilteredQuestions();
  const score = catScore();
  const pct = qs.length ? Math.round(score / qs.length * 100) : 0;
  let html = topbar();
  html += '<div class="wrap grid">';
  html += '<div class="card"><div class="row space"><div><h2>💻 RTT / CAT Kwartaal 2</h2><p class="muted">Eksamenvoorbereiding vir Graad 10. Kies ’n module of oefen alles gemeng.</p></div><button class="btn secondary" onclick="selectSubject(\'k53\')">Back to K53</button></div></div>';

  html += '<div class="card"><h2>Modules</h2><div class="row" style="margin-top:12px">';
  catQ2Modules.forEach(function(m){
    const active = (state.catModule || "all") === m.id ? " active" : "";
    html += '<button class="tabBtn' + active + '" onclick="state.catModule=\'' + m.id + '\';state.catShowAnswers=false;save();render()">' + esc(m.title) + '</button>';
  });
  html += '</div></div>';

    html += '<div class="card"><div class="row space"><div><h2>📝 Practical Simulator</h2><p class="muted">Doen ’n Word practical direk in die app en kry dadelik ’n punt.</p></div><button class="btn" onclick="state.screen=\'cat_word\';save();render()">Open Word Simulator</button></div></div>';

  html += catTasksHTML();

  html += '<div class="card"><div class="row space"><div><h2>Practice Questions</h2><p class="muted">Score wys eers nadat jy Mark Answers druk.</p></div><div class="row"><button class="btn" onclick="state.catShowAnswers=true;save();render()">Mark Answers</button><button class="btn secondary" onclick="catReset()">Reset</button></div></div>';
  html += '<div class="note" style="text-align:center;margin-top:12px"><b>Questions:</b> ' + qs.length + ' | <b>Score:</b> ' + (state.catShowAnswers ? (score + "/" + qs.length + " (" + pct + "%)") : "?") + '</div>';
  html += '<div class="grid" style="margin-top:14px">';

  qs.forEach(function(q,i){
    const mod = state.catModule || "all";
    const chosen = (state.catAnswers||{})[mod + "-" + i];
    const reveal = !!state.catShowAnswers;
    html += '<div class="questionBox"><b>' + (i+1) + '. ' + esc(q.q) + '</b><div class="optionGrid" style="margin-top:12px">';
    q.o.forEach(function(o,oi){
      let cls = "optionBtn";
      if(chosen===oi && !reveal) cls += " selected";
      if(reveal && q.a===oi) cls += " correct";
      if(reveal && chosen===oi && q.a!==oi) cls += " wrong";
      html += '<button class="' + cls + '" onclick="catChoose(' + i + ',' + oi + ')">' + String.fromCharCode(65+oi) + '. ' + esc(o) + '</button>';
    });
    html += '</div>';
    if(reveal) html += '<div class="note" style="margin-top:12px"><b>Verduideliking:</b> ' + esc(q.w) + '</div>';
    html += '</div>';
  });

  html += '</div></div></div>';
  return html;
}


// === RTT WORD PRACTICAL SIMULATOR V1 ===
function ensureWordSim(){
  if(!state.wordSim){
    state.wordSim = {
      title:"",
      body:"",
      header:"",
      footer:"",
      landscape:false,
      pageNumbers:false,
      columns:false,
      table:false,
      boldHeading:false,
      centeredHeading:false,
      marked:false
    };
  }
  return state.wordSim;
}

function wordSimSet(field, value){
  const w = ensureWordSim();
  w[field] = value;
  w.marked = false;
  save();
}

function wordSimToggle(field){
  const w = ensureWordSim();
  w[field] = !w[field];
  w.marked = false;
  save();
  render();
}

function wordSimReset(){
  state.wordSim = {
    title:"",
    body:"",
    header:"",
    footer:"",
    landscape:false,
    pageNumbers:false,
    columns:false,
    table:false,
    boldHeading:false,
    centeredHeading:false,
    marked:false
  };
  save();
  render();
}

function wordSimMark(){
  const w = ensureWordSim();
  w.marked = true;
  save();
  render();

  const r = wordSimResult();
  sendResultToParent({
    student: state.student || "Enrico",
    subject: "RTT / CAT",
    mode: "Word Practical Simulator",
    task: "Kwartaal 2 Word practical",
    module: "3.5 Verdere formatering / 3.6 Tabelle",
    status: r.passed ? "Passed" : "Needs practice",
    score: r.score,
    total: r.total,
    percent: r.percent,
    passed: r.passed,
    wrongCount: r.total - r.score,
    weakAreas: r.missing.length ? r.missing.join(", ") : "None",
    wrongQuestions: r.missing.length ? "Improve: " + r.missing.join(", ") : "None",
    device: navigator.userAgent || ""
  });
}

function wordSimResult(){
  const w = ensureWordSim();
  const checks = [
    {ok: w.title.trim().length >= 5, text:"Opskrif is ingevul"},
    {ok: w.boldHeading, text:"Opskrif is bold gemaak"},
    {ok: w.centeredHeading, text:"Opskrif is gesentreer"},
    {ok: w.body.trim().length >= 80, text:"Minstens twee kort paragrawe is ingevul"},
    {ok: w.header.trim().length >= 3, text:"Header is ingevul"},
    {ok: w.footer.trim().length >= 3 || w.pageNumbers, text:"Footer of page number is ingevul"},
    {ok: w.landscape || w.columns || w.table, text:"Minstens een gevorderde Word-funksie is gebruik"}
  ];
  const score = checks.filter(function(c){ return c.ok; }).length;
  const total = checks.length;
  const percent = Math.round(score / total * 100);
  return {
    checks: checks,
    score: score,
    total: total,
    percent: percent,
    passed: percent >= 70,
    missing: checks.filter(function(c){ return !c.ok; }).map(function(c){ return c.text; })
  };
}

function catWordSimulatorHTML(){
  const w = ensureWordSim();
  const r = wordSimResult();

  html += '<div class="card"><h2>Instruksies</h2><div class="note" style="margin-top:12px">';
  html += '<b>Taak:</b> Skep ’n kort dokument oor Computer Hardware and Software. Vul ’n opskrif, paragrawe, header/footer in, en gebruik minstens een Word-funksie soos landscape, columns of table.';
  html += '</div></div>';

  html += '<div class="card"><div class="row space"><div><h2>Jou dokument</h2><p class="muted">Tik jou werk hieronder. Klik dan Mark Practical.</p></div><div class="row"><button class="btn secondary" onclick="wordSimReset()">Reset</button><button class="btn" onclick="wordSimMark()">Mark Practical</button></div></div>';

  html += '<div class="grid two" style="margin-top:14px">';

  html += '</div>';
  html += '</div>';

  html += '<label class="field">Opskrif</label>';
  html += '<input value="' + esc(w.title) + '" oninput="wordSimSet(\'title\',this.value)" placeholder="Computer Hardware and Software">';

  html += '<div class="row" style="margin-top:12px">';

  html += '<button class="btn secondary" onclick="wordSimToggle(\'centeredHeading\')">' + (w.centeredHeading ? "✓ " : "") + 'Centre heading</button>';
  html += '<button class="btn secondary" onclick="wordSimToggle(\'landscape\')">' + (w.landscape ? "✓ " : "") + 'Landscape</button>';
  html += '<button class="btn secondary" onclick="wordSimToggle(\'pageNumbers\')">' + (w.pageNumbers ? "✓ " : "") + 'Page numbers</button>';
  html += '<button class="btn secondary" onclick="wordSimToggle(\'columns\')">' + (w.columns ? "✓ " : "") + 'Columns</button>';
  html += '<button class="btn secondary" onclick="wordSimToggle(\'table\')">' + (w.table ? "✓ " : "") + 'Table</button>';
  html += '</div>';

  html += '<label class="field">Paragrawe</label>';
  html += '<textarea style="width:100%;min-height:170px;border:1px solid #e2e8f0;border-radius:18px;padding:14px;font:inherit" oninput="wordSimSet(\'body\',this.value)" placeholder="Tik twee kort paragrawe hier...">' + esc(w.body) + '</textarea>';

  html += '<div class="note" style="margin-top:14px">';
  html += '<b>Preview:</b><br>';
  html += '<div style="margin-top:10px;border:1px solid #e2e8f0;border-radius:16px;padding:16px;background:white">';
  html += '<div class="muted">' + esc(w.header || "Header kom hier") + '</div>';
  html += '<h2 style="' + (w.centeredHeading ? "text-align:center;" : "") + (w.boldHeading ? "font-weight:900;" : "font-weight:500;") + '">' + esc(w.title || "Opskrif kom hier") + '</h2>';
  html += '<div style="' + (w.columns ? "columns:2;column-gap:26px;" : "") + '">' + esc(w.body || "Paragrawe kom hier...").replace(/\n/g,"<br>") + '</div>';
  if(w.table){
    html += '<table style="width:100%;margin-top:14px;border-collapse:collapse"><tr><th style="border:1px solid #cbd5e1;padding:8px">Item</th><th style="border:1px solid #cbd5e1;padding:8px">Type</th></tr><tr><td style="border:1px solid #cbd5e1;padding:8px">Keyboard</td><td style="border:1px solid #cbd5e1;padding:8px">Input</td></tr><tr><td style="border:1px solid #cbd5e1;padding:8px">Monitor</td><td style="border:1px solid #cbd5e1;padding:8px">Output</td></tr></table>';
  }
  html += '<div class="muted" style="margin-top:14px">' + esc(w.footer || (w.pageNumbers ? "Page 1" : "Footer kom hier")) + '</div>';
  html += '</div></div>';

  if(w.marked){
    html += '<div class="card" style="margin-top:14px"><h2>Resultaat: ' + r.score + '/' + r.total + ' (' + r.percent + '%)</h2>';
    html += '<div class="grid" style="margin-top:12px">';
    r.checks.forEach(function(c){
      html += '<div class="note">' + (c.ok ? "✅ " : "❌ ") + esc(c.text) + '</div>';
    });
    html += '</div>';
    html += '<div class="note" style="margin-top:12px"><b>' + (r.passed ? "Goed gedoen!" : "Oefen weer.") + '</b></div>';
    html += '</div>';
  }

  html += '</div>';
  html += '</div>';
  return html;
}

function render(){
  const app=document.getElementById("app");
  if(!state.student) app.innerHTML=loginHTML();
  else if(state.screen==="dashboard") app.innerHTML=dashboardHTML();
  else if(state.screen==="exam") app.innerHTML=examHTML();
  else if(state.screen==="cat_word") app.innerHTML=catWordSimulatorHTML();
  else if(state.screen==="cat") app.innerHTML=catExamHTML();
  else app.innerHTML=studyHTML();
}
load(); render(); if(state.screen==="exam" && state.examStarted && !state.examFinished) startTimer();
