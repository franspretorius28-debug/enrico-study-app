    .btn{border:0;border-radius:18px;padding:12px 16px;background:var(--dark);color:#fff;font-weight:800;cursor:pointer}
    .btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
    .btn.ghost{background:#f1f5f9;color:var(--ink)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .space{justify-content:space-between}
    .card{background:white;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
    .topbar{position:sticky;top:0;background:rgba(248,250,252,.92);backdrop-filter:blur(10px);z-index:10;padding:10px 0}
    .grid{display:grid;gap:14px}
    .subjects{grid-template-columns:repeat(3,minmax(0,1fr))}
    .two{grid-template-columns:320px 1fr}
    .moduleBtn,.subjectBtn,.optionBtn{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:22px;padding:14px;cursor:pointer}
    .moduleBtn.active,.subjectBtn.active,.optionBtn.selected{background:var(--dark);color:white;border-color:var(--dark)}

    .progress{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}
    .progress>div{height:100%;background:#0f172a}
    .questionBox{border:1px solid var(--line);border-radius:24px;background:white;padding:16px}

    .note{background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:14px}

    "module": "markings",
    "image": "brokenline",
    "q": "Look at the road marking. What may you do?",
    "options": [
      "Change lanes only when it is safe and legal",
      "Park on the line",
      "Ignore all traffic",
      "Drive on the wrong side"
    ],
    "answer": 0,
    "why": "A broken line may be crossed if it is safe and legal."
  },
  {
    "id": "img_left_arrow_001",
    "module": "markings",
    "image": "leftarrow",
    "q": "Look at the road marking. What must you do from this lane?",
    "options": [
      "Turn left",
      "Turn right",
      "Make a U-turn",
      "Stop and park"
    ],
    "answer": 0,
    "why": "Lane arrows show the direction you must follow from that lane."
  },
  {
    "id": "img_ped_crossing_001",
    "module": "markings",
    "image": "pedcrossing",
    "q": "Look at the road marking. What is it?",
    "options": [
      "A pedestrian crossing",
      "A racing line",
      "Truck parking",
      "A no-road area"
    ],
    "answer": 0,
    "why": "Pedestrian crossing markings show where pedestrians may cross."
  }
];

let state = {
  student:null, screen:"login", selectedSubject:"k53", selectedModule:"overview",
  quizMode:"all", answers:{}, showAnswers:false, parentMode:false,
  examStarted:false, examFinished:false, examIndex:0, examAnswers:{}, examSecondsLeft:30*60, examSet:null
};
let timer = null;

function save(){ localStorage.setItem("enricoStudyApp", JSON.stringify(state)); }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("enricoStudyApp")||"{}");
    state = {...state, ...s, screen: s.student ? "dashboard" : "login"};
  }catch(e){}
}
function setState(p){ state={...state,...p}; save(); render(); }
function esc(v){ return String(v ?? "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }

function imageHTML(q){
  if(!q.image) return "";
  const signs = {
    stop:`<svg viewBox="0 0 220 160"><polygon points="80,10 140,10 190,60 190,100 140,150 80,150 30,100 30,60" fill="#dc2626" stroke="#991b1b" stroke-width="6"/><text x="110" y="92" text-anchor="middle" font-size="34" font-weight="900" fill="white">STOP</text></svg>`,
    yield:`<svg viewBox="0 0 220 160"><polygon points="110,145 25,20 195,20" fill="white" stroke="#dc2626" stroke-width="12"/><text x="110" y="72" text-anchor="middle" font-size="18" font-weight="900" fill="#111827">YIELD</text></svg>`,
    noentry:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="58" fill="#dc2626"/><rect x="62" y="68" width="96" height="24" rx="8" fill="white"/></svg>`,
    speed60:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="white" stroke="#dc2626" stroke-width="10"/><text x="110" y="98" text-anchor="middle" font-size="52" font-weight="900" fill="#111827">60</text></svg>`,
    nouturn:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="white" stroke="#dc2626" stroke-width="10"/><path d="M80 112 C80 72 118 70 118 70 L118 45 L152 84 L118 123 L118 96 C100 96 98 102 98 112" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><line x1="65" y1="35" x2="155" y2="125" stroke="#dc2626" stroke-width="12"/></svg>`,
    keepleft:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="#2563eb"/><path d="M125 38 L80 80 L125 122" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    oneway:`<svg viewBox="0 0 220 160"><rect x="25" y="45" width="170" height="70" rx="8" fill="#2563eb"/><path d="M65 80 H145" stroke="white" stroke-width="16" stroke-linecap="round"/><path d="M132 50 L165 80 L132 110" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    pedestrian:`<svg viewBox="0 0 220 160"><polygon points="110,10 200,80 110,150 20,80" fill="#facc15" stroke="#111827" stroke-width="5"/><circle cx="110" cy="55" r="11" fill="#111827"/><path d="M110 68 L98 100 L82 125 M110 68 L130 98 L145 125 M105 82 L85 85 M115 82 L138 78" stroke="#111827" stroke-width="8" stroke-linecap="round"/></svg>`,
    children:`<svg viewBox="0 0 220 160"><polygon points="110,10 200,80 110,150 20,80" fill="#facc15" stroke="#111827" stroke-width="5"/><circle cx="92" cy="58" r="9" fill="#111827"/><circle cx="128" cy="58" r="9" fill="#111827"/><path d="M92 70 L82 108 M92 70 L105 104 M128 70 L118 108 M128 70 L142 104 M72 85 H145" stroke="#111827" stroke-width="7" stroke-linecap="round"/></svg>`,
    slippery:`<svg viewBox="0 0 220 160"><polygon points="110,10 200,80 110,150 20,80" fill="#facc15" stroke="#111827" stroke-width="5"/><path d="M70 60 H150 L135 90 H85 Z" fill="#111827"/><path d="M75 118 C95 95 115 140 135 118 M70 98 C90 78 110 120 130 98" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/></svg>`,
    trafficlight:`<svg viewBox="0 0 220 160"><polygon points="110,10 200,80 110,150 20,80" fill="#facc15" stroke="#111827" stroke-width="5"/><rect x="88" y="38" width="44" height="86" rx="10" fill="#111827"/><circle cx="110" cy="58" r="9" fill="#ef4444"/><circle cx="110" cy="81" r="9" fill="#facc15"/><circle cx="110" cy="104" r="9" fill="#22c55e"/></svg>`,
    railway:`<svg viewBox="0 0 220 160"><polygon points="110,10 200,80 110,150 20,80" fill="#facc15" stroke="#111827" stroke-width="5"/><path d="M70 120 L98 45 H122 L150 120 M88 72 H132 M80 96 H140" stroke="#111827" stroke-width="8" stroke-linecap="round"/></svg>`,
    roundabout:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="#2563eb"/><path d="M110 42 C140 42 158 65 150 92 M150 92 L168 82 M150 92 L145 72 M110 118 C80 118 62 95 70 68 M70 68 L52 78 M70 68 L75 88" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    noparking:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="white" stroke="#dc2626" stroke-width="10"/><text x="110" y="100" text-anchor="middle" font-size="58" font-weight="900" fill="#2563eb">P</text><line x1="65" y1="35" x2="155" y2="125" stroke="#dc2626" stroke-width="12"/></svg>`,
    nostopping:`<svg viewBox="0 0 220 160"><circle cx="110" cy="80" r="60" fill="#2563eb" stroke="#dc2626" stroke-width="10"/><line x1="65" y1="35" x2="155" y2="125" stroke="#dc2626" stroke-width="12"/><line x1="155" y1="35" x2="65" y2="125" stroke="#dc2626" stroke-width="12"/></svg>`,
    stopline:`<svg viewBox="0 0 220 160"><rect width="220" height="160" fill="#475569"/><line x1="30" y1="80" x2="190" y2="80" stroke="white" stroke-width="16"/><text x="110" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="white">STOP LINE</text></svg>`,
    solidline:`<svg viewBox="0 0 220 160"><rect width="220" height="160" fill="#475569"/><line x1="110" y1="15" x2="110" y2="145" stroke="white" stroke-width="12"/></svg>`,
    brokenline:`<svg viewBox="0 0 220 160"><rect width="220" height="160" fill="#475569"/><line x1="110" y1="15" x2="110" y2="45" stroke="white" stroke-width="12"/><line x1="110" y1="65" x2="110" y2="95" stroke="white" stroke-width="12"/><line x1="110" y1="115" x2="110" y2="145" stroke="white" stroke-width="12"/></svg>`,
    leftarrow:`<svg viewBox="0 0 220 160"><rect width="220" height="160" fill="#475569"/><path d="M145 80 H70 M95 48 L65 80 L95 112" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    pedcrossing:`<svg viewBox="0 0 220 160"><rect width="220" height="160" fill="#475569"/><g fill="white"><rect x="35" y="28" width="22" height="104"/><rect x="72" y="28" width="22" height="104"/><rect x="109" y="28" width="22" height="104"/><rect x="146" y="28" width="22" height="104"/></g></svg>`
  };
  return `<div class="qImage">${signs[q.image] || ""}</div>`;
}

function fmtTime(seconds){ const m=Math.floor(seconds/60); const s=seconds%60; return `${m}:${String(s).padStart(2,"0")}`; }
function filteredQuestions(){ return state.quizMode==="all" ? questions : questions.filter(q=>q.module===state.quizMode); }
function examQuestions(){ return (state.examSet && state.examSet.length ? state.examSet : questions.slice(0,64)); }
function shuffleQuestions(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function examScore(){ return examQuestions().reduce((sum,q,i)=>sum+(state.examAnswers[i]===q.answer?1:0),0); }
function answeredCount(){ return filteredQuestions().filter((_,i)=>state.answers[`${state.quizMode}-${i}`]!==undefined).length; }
function quizScore(){ return filteredQuestions().reduce((sum,q,i)=>sum+(state.answers[`${state.quizMode}-${i}`]===q.answer?1:0),0); }

function startExam(){
  setState({screen:"exam", examStarted:true, examFinished:false, examIndex:0, examAnswers:{}, examSecondsLeft:30*60, examSet:shuffleQuestions(questions).slice(0,64)});
  startTimer();
}
function finishExam(){ setState({examFinished:true}); stopTimer(); }
function startTimer(){
  stopTimer();
  timer=setInterval(()=>{
    if(state.screen!=="exam" || !state.examStarted || state.examFinished) return stopTimer();
    if(state.examSecondsLeft<=0){ finishExam(); return; }
    state.examSecondsLeft -= 1; save(); render();
  },1000);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function login(){
  const name = document.getElementById("loginName").value.trim();
  const pin = document.getElementById("loginPin").value.trim();
  if(!name){ alert("Enter student name"); return; }
  if(pin !== STUDENT_PIN){ alert("Wrong PIN"); return; }
  setState({student:name, screen:"dashboard"});
}
function logout(){
  stopTimer();
  setState({student:null, screen:"login", examStarted:false, examFinished:false});
}
function choosePractice(i,o){ state.answers[`${state.quizMode}-${i}`]=o; save(); render(); }
function resetPractice(){ filteredQuestions().forEach((_,i)=>delete state.answers[`${state.quizMode}-${i}`]); setState({showAnswers:false}); }
function chooseExam(o){ state.examAnswers[state.examIndex]=o; save(); render(); }

function loginHTML(){
  return `<div class="center"><div class="login">
    <div class="logo">🎓</div>
    <h1 style="text-align:center">Study App</h1>
    <p class="muted" style="text-align:center;margin-top:8px">Login and choose your subject.</p>
    <label class="field">Student name</label><input id="loginName" value="${esc(STUDENT_NAME)}" />
    <label class="field">PIN</label><input id="loginPin" type="password" value="${esc(STUDENT_PIN)}" />
    <button class="btn" style="width:100%;margin-top:16px;padding:16px" onclick="login()">Login</button>
    <div class="note" style="margin-top:16px">PIN for now: <b>1234</b>. Later we can connect real accounts and save progress online.</div>
  </div></div>`;
}
function topbar(){
  return `<div class="topbar"><div class="wrap"><div class="card row space">
    <div class="row"><div style="font-size:30px">🎓</div><div><h1>Student Study App</h1><div class="muted">Logged in as ${esc(state.student)}</div></div></div>
    <div class="row">
      <button class="btn secondary" onclick="setState({screen:'dashboard'})">Subjects</button>
      <button class="btn secondary" onclick="setState({screen:'study'})">Study</button>
      <button class="btn" onclick="startExam()">Start K53 Exam</button>
      <button class="btn secondary" onclick="logout()">Logout</button>
    </div>
  </div></div></div>`;
}
function dashboardHTML(){
  return `${topbar()}<div class="wrap grid">
    <div class="card">
      <div class="row" style="margin-bottom:14px"><div style="font-size:28px">📱</div><div><h2>Choose a subject</h2><p class="muted">K53 is active now. The other subjects will be added here.</p></div></div>
      <div class="grid subjects">
        ${subjects.map(s=>`<button class="subjectBtn ${s.id===state.selectedSubject?'active':''}" onclick="selectSubject('${s.id}')">
          <div style="font-size:34px;margin-bottom:10px">${s.icon}</div><h3>${esc(s.title)}</h3><p class="muted">${esc(s.subtitle)}</p><span class="pill ${s.status==='Active'?'active':''}">${esc(s.status)}</span>
        </button>`).join("")}
      </div>
    </div>
  </div>`;
}
function selectSubject(id){
  state.selectedSubject=id;
  state.screen = id==="k53" ? "study" : "dashboard";
  save(); render();
}
function studyHTML(){
  const active = modules.find(m=>m.id===state.selectedModule)||modules[0];
  const fq = filteredQuestions();
  const score = quizScore(); const ans = answeredCount();
  const pct = fq.length?Math.round(score/fq.length*100):0;
  return `${topbar()}<div class="wrap grid two">
    <div class="grid">
      <div class="card"><h2>📚 K53 Modules</h2><div style="height:12px"></div>
        ${modules.map(m=>`<button class="moduleBtn ${m.id===state.selectedModule?'active':''}" onclick="setState({selectedModule:'${m.id}'})"><b>${esc(m.title)}</b><br><span class="muted">${esc(m.badge)}</span></button>`).join("")}
      </div>
      <div class="card"><h2>🏆 Progress</h2><p class="row space"><span>Answers completed</span><b>${ans}/${fq.length}</b></p>
        <div class="progress"><div style="width:${fq.length?ans/fq.length*100:0}%"></div></div>
        <div class="note" style="text-align:center;margin-top:14px"><div style="font-size:30px;font-weight:900">${state.showAnswers||state.parentMode?`${score}/${fq.length}`:"?"}</div><div>${state.showAnswers||state.parentMode?`${pct}%`:"Write first, then mark."}</div></div>
      </div>
    </div>
    <div class="grid">
      <div class="card"><div class="row space"><div><h2>${esc(active.title)}</h2><p class="muted">Short study notes for this section.</p></div><span class="pill">${esc(active.badge)}</span></div>
        <div class="grid subjects" style="margin-top:14px">${active.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div>
      </div>
      <div class="card">
        <div class="row space"><div><h2>📝 Practice Test</h2><p class="muted">Choose answers and mark when finished.</p></div>
          <div class="row">
            <select style="width:auto" onchange="state.quizMode=this.value;state.showAnswers=false;save();render()">
              ${[["all","Mixed test"],["controls","Controls"],["defensive","Defensive Driving"],["signs","Road Signs"],["markings","Road Markings"],["rules","Rules"]].map(([v,l])=>`<option value="${v}" ${state.quizMode===v?'selected':''}>${l}</option>`).join("")}
            </select>
            <button class="btn secondary" onclick="setState({parentMode:!state.parentMode})">${state.parentMode?"Unlock":"Lock"} Parent</button>
            <button class="btn" onclick="setState({showAnswers:true})">Mark Answers</button>
            <button class="btn secondary" onclick="resetPractice()">Reset</button>
          </div>
        </div>
        <div class="grid" style="margin-top:14px">${fq.map((q,i)=>questionHTML(q,i)).join("")}</div>
      </div>
    </div>
  </div>`;
}
function questionHTML(q,i){
  const key=`${state.quizMode}-${i}`; const chosen=state.answers[key]; const reveal=state.showAnswers||state.parentMode;
  return `<div class="questionBox">${imageHTML(q)}<b>${i+1}. ${esc(q.q)}</b><div class="optionGrid" style="margin-top:12px">
    ${q.options.map((o,oi)=>{
      let cls="optionBtn";
      if(chosen===oi && !reveal) cls+=" selected";
      if(reveal && q.answer===oi) cls+=" correct";
      if(reveal && chosen===oi && q.answer!==oi) cls+=" wrong";
      return `<button class="${cls}" onclick="choosePractice(${i},${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`;
    }).join("")}
  </div>${reveal?`<div class="note" style="margin-top:12px"><b>Explanation:</b> ${esc(q.why)}</div>`:""}</div>`;
}
function examHTML(){
  const eq=examQuestions(); const q=eq[state.examIndex]; const score=examScore(); const pct=eq.length?Math.round(score/eq.length*100):0; const passed=pct>=75;
  return `${topbar()}<div class="wrap"><div class="card">
    <div class="row space"><div><h2>🏆 K53 Exam Mode</h2><p class="muted">One question at a time, timer, finish button, and score.</p></div>
      <div class="row">${!state.examStarted?`<button class="btn" onclick="startExam()">Start Exam</button>`:""}${state.examStarted&&!state.examFinished?`<button class="btn secondary" onclick="finishExam()">Finish</button>`:""}</div>
    </div>
    ${!state.examStarted?`<div class="note" style="margin-top:14px"><b>Instructions:</b><br>Read each question carefully. Choose only one answer. When you are done, click Finish to see your score.</div>`:""}
    ${state.examStarted && q && !state.examFinished ? `<div class="grid" style="margin-top:14px">
      <div class="examHeader"><b>Question ${state.examIndex+1} of ${eq.length}</b><b>Answered: ${Object.keys(state.examAnswers).length}/${eq.length}</b><div class="timer">${fmtTime(state.examSecondsLeft)}</div></div>
      <div class="questionBox">${imageHTML(q)}<h2>${esc(q.q)}</h2><div class="optionGrid" style="margin-top:14px">${q.options.map((o,oi)=>`<button class="optionBtn ${state.examAnswers[state.examIndex]===oi?'selected':''}" onclick="chooseExam(${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join("")}</div></div>
      <div class="row space"><button class="btn secondary" ${state.examIndex===0?'disabled':''} onclick="setState({examIndex:Math.max(0,state.examIndex-1)})">Previous</button>${state.examIndex<eq.length-1?`<button class="btn" onclick="setState({examIndex:Math.min(${eq.length-1},state.examIndex+1)})">Next</button>`:`<button class="btn" onclick="finishExam()">Finish Exam</button>`}</div>
    </div>`:""}
    ${state.examStarted && state.examFinished ? `<div class="grid" style="margin-top:14px">
      <div class="card ${passed?'resultGood':'resultBad'}" style="text-align:center"><div style="font-size:42px;font-weight:900">${score}/${eq.length}</div><h2>${pct}% — ${passed?"PASS":"TRY AGAIN"}</h2><p>K53 practice score. Each exam randomly selects 64 questions from the larger practice bank.</p></div>
      ${eq.map((qq,i)=>{
        const chosen=state.examAnswers[i]; const correct=chosen===qq.answer;
        return `<div class="questionBox ${correct?'resultGood':'resultBad'}">${imageHTML(qq)}<b>${i+1}. ${esc(qq.q)}</b><div>Your answer: ${chosen===undefined?"None":`${String.fromCharCode(65+chosen)}. ${esc(qq.options[chosen])}`}</div>${!correct?`<div><b>Correct answer:</b> ${String.fromCharCode(65+qq.answer)}. ${esc(qq.options[qq.answer])}</div>`:""}<div class="muted">${esc(qq.why)}</div></div>`;
      }).join("")}
    </div>`:""}
  </div></div>`;
}
function render(){
  const app=document.getElementById("app");
  if(!state.student) app.innerHTML=loginHTML();
  else if(state.screen==="dashboard") app.innerHTML=dashboardHTML();
  else if(state.screen==="exam") app.innerHTML=examHTML();
  else app.innerHTML=studyHTML();
}
load(); render(); if(state.screen==="exam" && state.examStarted && !state.examFinished) startTimer();
</script>
</body>
</html>
